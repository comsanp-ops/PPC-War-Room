    const list = z === '__all__' ? households : (zones[z] || []);
    const format = modal.querySelector('input[name="pdfFormat"]:checked').value;
    const perPage = format === 'full' ? 1 : format === 'compact' ? 4 : 999;
    const pages = format === 'summary' ? 1 : Math.ceil(list.length / perPage);
    modal.querySelector('#pdfPreviewCount').textContent = list.length;
    modal.querySelector('#pdfPreviewPages').textContent = '~' + (pages + 2);
  };
  zoneSelect.addEventListener('change', updatePreview);
  modal.querySelectorAll('input[name="pdfFormat"]').forEach(r => r.addEventListener('change', updatePreview));

  modal.querySelector('#generateMultiPDF').addEventListener('click', async () => {
    const zone = zoneSelect.value;
    const format = modal.querySelector('input[name="pdfFormat"]:checked').value;
    const includePhotos = modal.querySelector('#pdfIncludePhotos').checked;
    const includeHealth = modal.querySelector('#pdfIncludeHealth').checked;
    const includeStats = modal.querySelector('#pdfIncludeStats').checked;
    const sortByRisk = modal.querySelector('#pdfSortByRisk').checked;
    modal.remove();
    const list = (zone === '__all__' ? households : zones[zone] || []).slice();
    if(sortByRisk) list.sort((a, b) => num(b.riskLevel) - num(a.riskLevel));
    await generateMultiHouseholdPDF({
      households: list,
      zone: zone === '__all__' ? 'ทุกหมู่' : zone,
      format, includePhotos, includeHealth, includeStats
    });
  });
}

async function generateMultiHouseholdPDF(opts){
  const { jsPDF } = window.jspdf;
  const { households, zone, format, includePhotos, includeHealth, includeStats } = opts;
  toast(`📄 กำลังสร้าง PDF ${households.length} ครัวเรือน…`, 'info', 5000);
  const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const W = 210, H = 297, M = 14, cW = W - M * 2;
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  const dateStr = `${p(now.getDate())}/${p(now.getMonth()+1)}/${now.getFullYear()+543} ${p(now.getHours())}:${p(now.getMinutes())}`;

  pdf.setFillColor(14, 22, 40); pdf.rect(0, 0, W, 65, 'F');
  pdf.setTextColor(0, 240, 255); pdf.setFontSize(26); pdf.setFont(undefined, 'bold');
  pdf.text('🛰️', M, 25);
  pdf.setFontSize(20); pdf.setTextColor(255, 255, 255);
  pdf.text('รายงานครัวเรือนแบบกลุ่ม', M + 18, 20);
  pdf.setFontSize(13); pdf.setTextColor(125, 211, 252);
  pdf.text(zone, M + 18, 30);
  pdf.setFontSize(9); pdf.setTextColor(180, 200, 220); pdf.setFont(undefined, 'normal');
  pdf.text('องค์การบริหารส่วนตำบลพลับพลาไชย', M + 18, 42);
  pdf.text('ต.พลับพลาไชย อ.อู่ทอง จ.สุพรรณบุรี', M + 18, 47);
  pdf.text(`สร้างเมื่อ: ${dateStr}`, M + 18, 55);
  pdf.text(`รวม ${households.length} ครัวเรือน`, W - M, 55, { align:'right' });

  let y = 75;

  if(includeStats){
    pdf.setTextColor(20, 40, 80); pdf.setFontSize(13); pdf.setFont(undefined, 'bold');
    pdf.text('📊 สรุปสถิติ', M, y); y += 8;
    const totalPop = households.reduce((s,h) => s + (Number(h.members) || 0), 0);
    const totalElderly = households.reduce((s,h) => s + (Number(h.elderly) || 0), 0);
    const totalBedridden = households.reduce((s,h) => s + (Number(h.bedridden) || 0), 0);
    const totalHighRisk = households.filter(h => Number(h.riskLevel) >= 70).length;
    const avgRisk = Math.round(households.reduce((s,h) => s + (Number(h.riskLevel)||0), 0) / Math.max(1, households.length));
    const stats = [
      { l:'ครัวเรือน', v: households.length, c:[0, 100, 180] },
      { l:'ประชากรรวม', v: totalPop + ' คน', c:[34, 100, 200] },
      { l:'ผู้สูงอายุ', v: totalElderly + ' คน', c:[100, 130, 220] },
      { l:'ผู้ป่วยติดเตียง', v: totalBedridden + ' คน', c:[200, 100, 80] },
      { l:'ความเสี่ยงสูง', v: totalHighRisk + ' หลัง', c:[220, 60, 60] },
      { l:'ความเสี่ยงเฉลี่ย', v: avgRisk + '%', c:[180, 100, 180] }
    ];
    const cellW = cW / 3, cellH = 18;
    stats.forEach((s, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const cx = M + col * cellW, cy = y + row * (cellH + 3);
      pdf.setFillColor(s.c[0], s.c[1], s.c[2]);
      pdf.roundedRect(cx, cy, cellW - 3, cellH, 2, 2, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFontSize(16); pdf.setFont(undefined, 'bold');
      pdf.text(String(s.v), cx + 4, cy + 10);
      pdf.setFontSize(8); pdf.setFont(undefined, 'normal');
      pdf.text(s.l, cx + 4, cy + 15);
    });
    y += Math.ceil(stats.length / 3) * (cellH + 3) + 8;
  }

  pdf.setTextColor(20, 40, 80); pdf.setFontSize(13); pdf.setFont(undefined, 'bold');
  pdf.text('📋 ตารางครัวเรือน', M, y); y += 6;
  const tableHeader = (yy) => {
    pdf.setFillColor(230, 240, 250); pdf.rect(M, yy - 4, cW, 7, 'F');
    pdf.setTextColor(40, 60, 90); pdf.setFontSize(8); pdf.setFont(undefined, 'bold');
    pdf.text('#', M + 2, yy); pdf.text('ครัวเรือน', M + 8, yy);
    pdf.text('สมาชิก', M + 85, yy); pdf.text('สูงอายุ', M + 105, yy);
    pdf.text('ติดเตียง', M + 125, yy); pdf.text('ความเสี่ยง', M + 150, yy);
    pdf.text('Risk', M + 178, yy);
  };
  tableHeader(y); y += 5;
  pdf.setFont(undefined, 'normal'); pdf.setFontSize(8);
  households.forEach((h, i) => {
    if(y > H - 30){ pdf.addPage(); y = 20; tableHeader(y); y += 5; }
    if(i % 2 === 0){ pdf.setFillColor(248, 250, 253); pdf.rect(M, y - 3.5, cW, 6, 'F'); }
    const risk = Number(h.riskLevel) || 0;
    pdf.setTextColor(40, 60, 90);
    pdf.text(String(i + 1), M + 2, y);
    pdf.text(String(h.name || '').slice(0, 38), M + 8, y);
    pdf.text(String(h.members || 0), M + 85, y);
    pdf.text(String(h.elderly || 0), M + 105, y);
    pdf.text(String(h.bedridden || 0), M + 125, y);
    pdf.text(String(h.riskLevel || 0) + '%', M + 150, y);
    const color = risk >= 70 ? [255, 45, 85] : risk >= 45 ? [255, 176, 32] : [34, 200, 100];
    pdf.setFillColor(color[0], color[1], color[2]);
    pdf.roundedRect(M + 172, y - 3.5, 6, 4, 1, 1, 'F');
    y += 6;
  });

  if(format === 'full' || format === 'compact'){
    const perPage = format === 'full' ? 1 : 4;
    let currentPage = 0;
    for(let i = 0; i < households.length; i += perPage){
      pdf.addPage();
      currentPage++;
      let py = 20;
      pdf.setFillColor(14, 22, 40); pdf.rect(0, 0, W, 15, 'F');
      pdf.setTextColor(125, 211, 252); pdf.setFontSize(9); pdf.setFont(undefined, 'bold');
      pdf.text(`รายละเอียดครัวเรือน — ${zone} · หน้า ${currentPage}`, M, 10);
      pdf.text(`${i + 1}–${Math.min(i + perPage, households.length)} / ${households.length}`,
        W - M, 10, { align:'right' });
      const chunk = households.slice(i, i + perPage);
      const rowH = format === 'full' ? (H - 40) / perPage : (H - 30) / perPage;
      for(let j = 0; j < chunk.length; j++){
        const h = chunk[j];
        const rh = rowH - 3;
        pdf.setDrawColor(220, 230, 240); pdf.setLineWidth(0.3);
        pdf.setFillColor(250, 252, 255); pdf.roundedRect(M, py, cW, rh, 2, 2, 'FD');
        const risk = Number(h.riskLevel) || 0;
        const accent = risk >= 70 ? [220, 60, 80] : risk >= 45 ? [220, 160, 40] : [40, 180, 100];
        pdf.setFillColor(accent[0], accent[1], accent[2]);
        pdf.rect(M, py, 2.5, rh, 'F');
        pdf.setTextColor(20, 40, 80);
        pdf.setFontSize(format === 'compact' ? 9 : 11); pdf.setFont(undefined, 'bold');
        pdf.text(String(h.name || '-').slice(0, 50), M + 6, py + 6);
        pdf.setFontSize(7.5); pdf.setTextColor(100, 130, 160); pdf.setFont(undefined, 'normal');
        pdf.text(`${h.zone || '-'} · ${h.id || ''} · #${h.houseNumber || '—'}`, M + 6, py + 10);
        pdf.setFillColor(accent[0], accent[1], accent[2]);
        pdf.roundedRect(cW - 22, py + 3, 18, 5, 1.5, 1.5, 'F');
        pdf.setTextColor(255, 255, 255); pdf.setFont(undefined, 'bold'); pdf.setFontSize(7.5);
        pdf.text(`RISK ${risk}%`, cW - 21, py + 6.5);
        const details = [
          ['บ้านเลขที่', String(h.houseNumber || '—').slice(0, 20)],
          ['หัวหน้า', String(h.head || '-').slice(0, 30)],
          ['สมาชิก', (h.members || 0) + ' คน'],
          ['ผู้สูงอายุ', (h.elderly || 0) + ' คน'],
          ['ติดเตียง', (h.bedridden || 0) + ' คน'],
          ['โทร', String(h.phone || '-')]
        ];
        if(includeHealth){
          const chronic = parseJSONField(h.chronic_patients, []);
          if(chronic.length) details.push(['ผู้ป่วยเรื้อรัง', chronic.map(c => c.condition).join(', ').slice(0, 40)]);
          if(h.needs_electricity) details.push(['⚠ ใช้ไฟฟ้า', 'ใช่']);
          if(h.drug_allergies) details.push(['⚠ แพ้ยา', h.drug_allergies]);
        }
        const colW = (cW - 12) / 2;
        details.forEach((d, k) => {
          const col = k % 2, row = Math.floor(k / 2);
          const dx = M + 6 + col * colW;
          const dy = py + 14 + row * 5;
          if(dy > py + rh - 3) return;
          pdf.setFontSize(7); pdf.setTextColor(120, 150, 180); pdf.setFont(undefined, 'normal');
          pdf.text(d[0] + ':', dx, dy);
          pdf.setTextColor(40, 60, 90); pdf.setFont(undefined, 'bold');
          pdf.text(String(d[1]), dx + 22, dy);
        });
        if(includePhotos && format === 'full'){
          const photos = parseJSONField(h.photos, []);
          if(photos.length){
            const imgW = 32, imgH = 24;
            const startX = M + cW - 100, startY = py + 14;
            photos.slice(0, 3).forEach((ph, pi) => {
              const px = startX + pi * (imgW + 3);
              try {
                if(ph.url && ph.url.startsWith('data:image/jpeg')){
                  pdf.addImage(ph.url, 'JPEG', px, startY, imgW, imgH, undefined, 'FAST');
                  pdf.setDrawColor(200, 215, 230); pdf.rect(px, startY, imgW, imgH, 'S');
                } else {
                  pdf.setFillColor(240, 244, 248); pdf.rect(px, startY, imgW, imgH, 'F');
                  pdf.setTextColor(150, 160, 180); pdf.setFontSize(6);
                  pdf.text('ไม่มีรูป', px + imgW/2, startY + imgH/2, { align:'center' });
                }
              } catch(e){}
            });
          }
        }
        py += rh + 3;
      }
    }
  }

  const total = pdf.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    pdf.setPage(i);
    pdf.setDrawColor(180, 200, 220); pdf.setLineWidth(0.2);
    pdf.line(M, H - 12, W - M, H - 12);
    pdf.setTextColor(120, 150, 180); pdf.setFontSize(7); pdf.setFont(undefined, 'normal');
    pdf.text('PhlapphlaChai 3D GeoAI Dashboard · อบต.พลับพลาไชย', M, H - 8);
    pdf.text(`หน้า ${i} / ${total}`, W - M, H - 8, { align:'right' });
  }
  const safeZone = zone.replace(/[^ก-๙a-zA-Z0-9]/g, '_');
  pdf.save(`households_${safeZone}_${Date.now()}.pdf`);
  toast(`📄 สร้าง PDF สำเร็จ (${total} หน้า)`, 'info', 5000);
  playSound('success');
}

/* ═══════════════════════════════════════════════════════════════════════
   HEATMAP / WIND / EVACUATION
   ═══════════════════════════════════════════════════════════════════════ */
function toggleHeat(){
  S.heat.on = !S.heat.on;
  if(!S.heat.layer){
    const pts = [];
    (S.payload.data.Households||[]).forEach(h => pts.push([num(h.lat), num(h.lng), clamp(num(h.members)/8, .2, 1)]));
    (S.payload.data.Bedridden||[]).forEach(b => pts.push([num(b.lat), num(b.lng), 1]));
    (S.payload.data.Emergency||[]).forEach(e => pts.push([num(e.lat), num(e.lng), 1]));
    (S.payload.data.VulnerableHouseholds||[]).forEach(v => pts.push([num(v.lat), num(v.lng), .9]));
    S.heat.layer = L.heatLayer(pts, {
      radius: 30, blur: 26, maxZoom: 17, minOpacity: .28,
      gradient: { .15:'#0ea5e9', .35:'#22ff88', .55:'#ffb020', .78:'#ff6b00', 1:'#ff2d55' }
    });
  }
  if(S.heat.on) S.heat.layer.addTo(S.map);
  else S.map.removeLayer(S.heat.layer);
  toast(S.heat.on ? '🔥 Heatmap เปิด' : 'ปิด Heatmap');
  playSound(S.heat.on ? 'on' : 'off');
}

function toggleWind(){
  S.wind.on = !S.wind.on;
  const cv = $('#windCanvas');
  if(S.wind.on){
    cv.classList.add('on');
    if(!S.wind.ctx){
      cv.width = window.innerWidth; cv.height = window.innerHeight;
      S.wind.ctx = cv.getContext('2d');
      for(let i = 0; i < 100; i++){
        S.wind.particles.push({
          x: Math.random()*cv.width, y: Math.random()*cv.height,
          px:0, py:0, life: Math.random()*200, max: 180 + Math.random()*160
        });
      }
    }
    if(!S.wind.raf) windLoop();
    toast('🌬️ ลมเปิด');
  } else {
    cv.classList.remove('on');
    if(S.wind.raf){ cancelAnimationFrame(S.wind.raf); S.wind.raf = null; }
  }
}
function windLoop(){
  const cv = $('#windCanvas'), ctx = S.wind.ctx;
  if(!cv || !ctx) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineCap = 'round';
  const rad = (S.wind.dir - 90) * Math.PI / 180;
  const spd = (S.wind.speed / 18) * 1.15;
  S.wind.particles.forEach(p => {
    const vx = Math.cos(rad) * spd, vy = Math.sin(rad) * spd;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy; p.life--;
    const a = 0.08 + 0.42 * (p.life / p.max);
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x - vx * 3.4, p.y - vy * 3.4);
    ctx.strokeStyle = `rgba(125,211,252,${a.toFixed(3)})`;
    ctx.lineWidth = 1.15;
    ctx.stroke();
    if(p.life <= 0 || p.x < -30 || p.x > cv.width+30 || p.y < -30 || p.y > cv.height+30){
      p.x = Math.random()*cv.width; p.y = Math.random()*cv.height;
      p.px = p.x; p.py = p.y; p.life = p.max;
    }
  });
  S.wind.raf = requestAnimationFrame(windLoop);
}

function computeEvacuation(origin, label){
  if(!window.turf) return;
  const shelters = (S.payload.data.Shelters || [])
    .filter(s => isFinite(num(s.lat)))
    .map(s => turf.point([num(s.lng), num(s.lat)], { name:s.name, phone:s.phone }));
  if(!shelters.length){ toast('⚠ ไม่พบศูนย์อพยพ', 'warn'); return; }
  const originPt = turf.point([origin.lng, origin.lat]);
  const near = turf.nearestPoint(originPt, turf.featureCollection(shelters));
  const km = turf.distance(originPt, near, { units: 'kilometers' });
  const mins = Math.max(1, Math.round((km / 26) * 60) + 1);
  const destLL = [near.geometry.coordinates[1], near.geometry.coordinates[0]];
  const group = L.layerGroup().addTo(S.map);
  L.polyline([origin, destLL], { color:'#22ff88', weight:4.5, opacity:.96, lineCap:'round' }).addTo(group);
  L.circleMarker(origin, { radius:10, color:'#ff2d55', fillColor:'#ff2d55', fillOpacity:.95 }).addTo(group);
  L.circleMarker(destLL, { radius:11, color:'#22ff88', fillColor:'#22ff88', fillOpacity:.95 }).addTo(group);
  S.map.flyToBounds(L.latLngBounds([origin, destLL]).pad(0.45), { duration: .9 });
  toast(`🚗 ${label||''} → ${near.properties.name} · ETA ${mins} นาที`, 'info', 5000);
  setTimeout(() => S.map.removeLayer(group), 30000);
}

function makeModal(opts){
  const backdrop = document.createElement('div');
  backdrop.className = 'tb-modal-backdrop';
  backdrop.innerHTML = `
    <div class="tb-modal ${opts.size || ''}">
      <div class="tb-modal-head">
        <div class="tb-modal-ico">${opts.icon || '⚙'}</div>

        ${opts.sub ? '<div class="tb-modal-sub">' + esc(opts.sub) + '</div>' : ''}</div>
        <button class="tb-modal-close" data-close>✕</button>
      </div>
      <div class="tb-modal-body">${opts.body || ''}</div>
      ${opts.actions ? '<div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06)">'+opts.actions+'</div>' : ''}

/* ═══════════════════════════════════════════════════════════════════════
   SCREENSHOT
   ═══════════════════════════════════════════════════════════════════════ */
function captureScreenshot(){
  const hudEls = document.querySelectorAll('.hud, .float-btn');
  const originals = [];
  hudEls.forEach((el, i) => { originals[i] = el.style.opacity; el.style.opacity = '0'; });
  setTimeout(() => {
    html2canvas($('#map'), { backgroundColor:'#04060c', useCORS:true, allowTaint:false, scale:1.5 })
      .then(canvas => {
        hudEls.forEach((el, i) => { el.style.opacity = originals[i] || ''; });
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'phlapphla_' + Date.now() + '.png';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          toast('📸 บันทึกภาพแล้ว');
        });
      }).catch(() => {
        hudEls.forEach((el, i) => { el.style.opacity = originals[i] || ''; });
        toast('⚠ บันทึกไม่สำเร็จ', 'warn');
      });
  }, 400);
}

function buildAIFab(){
  const btn = document.createElement('button');
  btn.id = 'aiFloatBtn'; btn.className = 'float-btn'; btn.textContent = '🤖';
  btn.title = 'AI Assistant';
  btn.addEventListener('click', openAIChat);
  document.body.appendChild(btn);
}
function buildIoTFab(){
  const btn = document.createElement('button');
  btn.id = 'iotFloatBtn'; btn.className = 'float-btn'; btn.textContent = '📡';
  btn.title = 'Realtime IoT';
  btn.addEventListener('click', openIoTPanel);
  document.body.appendChild(btn);
}
function openAIChat(){
  const backdrop = makeModal({
    icon:'🤖', title:'GeoAI Assistant', sub:'ถาม-ตอบข้อมูลตำบล',
    body: `
      <div id="aiLog" style="max-height:340px;overflow-y:auto;padding:4px">
        <div style="padding:12px;border-radius:12px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);font-size:12px;line-height:1.6;color:#dceaff">
          🤖 สวัสดี! ลองถามผม:
          <div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">
            ${['สรุปสถานการณ์วันนี้','บ้านหลังไหนเสี่ยงสูงสุด','ศูนย์อพยพที่ว่างมากสุด','มีผู้ป่วยติดเตียงกี่คน'].map(q => `
              <span style="padding:4px 10px;border-radius:99px;background:rgba(0,240,255,.15);border:1px solid rgba(0,240,255,.3);font-size:10.5px;cursor:pointer" data-q="${q}">${q}</span>
            `).join('')}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <input type="text" class="tb-input" id="aiInput" placeholder="พิมพ์คำถาม..." style="flex:1">
        <button class="tb-btn primary" id="aiSend">➤</button>
      </div>`
  });
  const log = backdrop.querySelector('#aiLog');
  const input = backdrop.querySelector('#aiInput');
  const append = (who, text) => {
    const isUser = who === 'user';
    const el = document.createElement('div');
    el.style.cssText = `padding:10px 14px;margin:8px 0;border-radius:12px;font-size:12px;line-height:1.6;max-width:85%;${isUser
      ? 'margin-left:auto;background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.4);color:#e0d5ff;'
      : 'background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.22);color:#dceaff;'}`;
    el.innerHTML = esc(text).replace(/\n/g, '<br>');
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  };
  const handleSend = (q) => {
    if(!q) return;
    append('user', q);
    input.value = '';
    setTimeout(() => append('ai', generateAnswer(q)), 500);
  };
  backdrop.querySelector('#aiSend').addEventListener('click', () => handleSend(input.value.trim()));
  input.addEventListener('keydown', e => { if(e.key === 'Enter') handleSend(input.value.trim()); });
  backdrop.querySelectorAll('[data-q]').forEach(chip => {
    chip.addEventListener('click', () => handleSend(chip.dataset.q));
  });
  input.focus();
}
function generateAnswer(q){
  const d = S.payload.data;
  const lq = q.toLowerCase();
  if(lq.includes('สรุป') || lq.includes('สถานการณ์')){
    const em = (d.Emergency||[]).filter(e => e.status === 'กำลังดำเนินการ').length;
    return `📊 สรุปสถานการณ์:\n• ครัวเรือน: ${(d.Households||[]).length}\n• เปราะบาง: ${(d.VulnerableHouseholds||[]).length}\n• ติดเตียง: ${(d.Bedridden||[]).length}\n• เหตุฉุกเฉิน: ${em}\n• ศูนย์อพยพ: ${(d.Shelters||[]).length}`;
  }
  if(lq.includes('เสี่ยง') && lq.includes('สูง')){
    const top = (d.Households||[]).slice().sort((a,b) => num(b.riskLevel) - num(a.riskLevel))[0];
    if(top) return `🏠 ${top.name}\n• บ้านเลขที่: ${top.houseNumber||'—'}\n• หัวหน้า: ${top.head}\n• ความเสี่ยง: ${top.riskLevel}%\n• หมู่: ${top.zone}`;
  }
  if(lq.includes('ศูนย์') && lq.includes('ว่าง')){
    const best = (d.Shelters||[]).slice().sort((a,b) =>
      (num(b.capacity)-num(b.current)) - (num(a.capacity)-num(a.current)))[0];
    if(best) return `🛡️ ${best.name}\n• ว่าง: ${num(best.capacity)-num(best.current)} คน\n• โทร: ${best.phone}`;
  }
  if(lq.includes('ติดเตียง') || lq.includes('ผู้ป่วย')){
    return `🛏️ มีผู้ป่วยติดเตียง ${(d.Bedridden||[]).length} คน\n⚠️ ต้องอพยพก่อน (Priority 1)`;
  }
  return '🤔 ลองถาม: "สรุปสถานการณ์วันนี้", "บ้านหลังไหนเสี่ยงสูงสุด"';
}
function openIoTPanel(){
  const d = S.payload.data;
  const iot = d.IoT || [];
  const watch = iot.filter(i => i.status === 'เฝ้าระวัง').length;
  makeModal({
    icon:'📡', title:'Realtime IoT', sub:`${iot.length} เซนเซอร์ · ${watch} เฝ้าระวัง`,
    body: `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
        <div style="padding:10px;border-radius:11px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2)">
          <div style="font-size:19px;font-weight:800;color:#00f0ff">${iot.length}</div>
          <div style="font-size:9px;color:#8fa8c8;margin-top:4px">Sensors</div>
        </div>
        <div style="padding:10px;border-radius:11px;background:rgba(34,255,136,.08);border:1px solid rgba(34,255,136,.2)">
          <div style="font-size:19px;font-weight:800;color:#22ff88">${iot.length-watch}</div>
          <div style="font-size:9px;color:#8fa8c8;margin-top:4px">ปกติ</div>
        </div>
        <div style="padding:10px;border-radius:11px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.2)">
          <div style="font-size:19px;font-weight:800;color:#ffb020">${watch}</div>
          <div style="font-size:9px;color:#8fa8c8;margin-top:4px">เฝ้าระวัง</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${iot.length ? iot.map(i => `
          <div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-left:3px solid ${i.status==='เฝ้าระวัง'?'#ffb020':'#00f0ff'}">
            <span style="font-size:15px">${IOT_ICON[i.type]||'📡'}</span>
            <span style="flex:1;font-size:11.5px;font-weight:600;color:#dceaff">${esc(i.name)}</span>
            <span style="font-size:14px;font-weight:800;color:${i.status==='เฝ้าระวัง'?'#ffb020':'#00f0ff'}">${esc(i.value)} ${esc(i.unit||'')}</span>
          </div>
        `).join('') : '<div style="text-align:center;padding:30px;color:#64748b">ไม่มีเซนเซอร์</div>'}
      </div>`
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   DOCK + SHORTCUTS + CLOCK
   ═══════════════════════════════════════════════════════════════════════ */
function wireDock(){
  $$('#dock .dock-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      playSound('click');
      const a = btn.dataset.act;
      if(a === 'recenter') S.map.flyTo([CFG.CENTER.lat, CFG.CENTER.lng], CFG.ZOOM, { duration: .9 });
      else if(a === 'basemap') openBasemapModal();
      else if(a === 'heat') toggleHeat();
      else if(a === 'wind') toggleWind();
      else if(a === 'analytics') openAnalytics();
      else if(a === 'multiPDF') openMultiHouseholdPDF();
      else if(a === 'screenshot') captureScreenshot();
      else if(a === 'evac'){
        const top = (S.payload.data.Households||[]).slice()
          .sort((x,y) => num(y.riskLevel) - num(x.riskLevel))[0];
        if(top) computeEvacuation(L.latLng(num(top.lat), num(top.lng)), top.name);
      } else if(a === 'sos'){
        playSound('alarm'); vibrate([40,30,40,30,80]);
        toast('🚨 กระจายสัญญาณแจ้งเหตุแล้ว', 'danger', 4000);
      }
    });
  });
}

function attachShortcuts(){
  document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea') return;
    if(ev.key === 'Escape') hideCard();
    if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key.toUpperCase();
    if(k === 'R'){ ev.preventDefault(); S.map.flyTo([CFG.CENTER.lat, CFG.CENTER.lng], CFG.ZOOM, { duration: .9 }); }
    else if(k === 'H'){ ev.preventDefault(); toggleHeat(); }
    else if(k === 'B'){ ev.preventDefault(); openBasemapModal(); }
    else if(/^[1-9]$/.test(ev.key)){
      const idx = +ev.key - 1;
      if(LAYER_DEFS[idx]) toggleLayer(LAYER_DEFS[idx].key);
    }
  });
}

function tickClock(){
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  const el = $('#clock');
  if(el) el.textContent = `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
}

/* ═══════════════════════════════════════════════════════════════════════
   MASTER BOOT
   ═══════════════════════════════════════════════════════════════════════ */
async function boot(){
  try {
    setBoot(5, 'เริ่มต้นระบบ GeoAI v' + CFG.VERSION);
    applyAmbient();
    setInterval(applyAmbient, 60000);
    startTilt();

    setBoot(15, 'สร้างแผนที่…');
    initMap();

    setBoot(25, 'กำลังโหลดข้อมูลจาก Sheet…');
    setStatus('กำลังโหลด…', 'warn');
    const raw = await loadData();
    S.payload = normalize(raw);

    setBoot(60, 'สร้าง ' + LAYER_DEFS.length + ' ชั้นข้อมูล…');
    buildAllLayers();

    setBoot(70, 'คืนค่า Basemap…');
    restoreBasemap();

    setBoot(80, 'เรนเดอร์ Layer Panel…');
    renderLayerPanel();

    setBoot(88, 'สร้าง UI…');
    buildAIFab();
    buildIoTFab();
    wireDock();
    attachShortcuts();
    tickClock();
    setInterval(tickClock, 1000);

    document.querySelectorAll('.hud').forEach(el => registerTilt(el));

    setBoot(100, 'พร้อมใช้งาน ✅');
    const srcLabels = {
      gas:'🔗 Live · GAS', fetch:'🔗 Live · Web App',
      cache:'💾 Cache', fallback:'⚠ Fallback'
    };
    setStatus(srcLabels[S.source] || 'พร้อมใช้งาน', S.source === 'fallback' ? 'error' : 'ok');

    setTimeout(() => {
      $('#boot').classList.add('hide');
      setTimeout(() => {
        const d = S.payload.data;
        const total = LAYER_DEFS.reduce((s, l) => s + (d[l.key] || []).length, 0);
        toast(`✅ เชื่อมต่อสำเร็จ · ${fmt(total)} รายการ จาก ${LAYER_DEFS.length} ชั้น`,
          S.source === 'fallback' ? 'warn' : 'info', 5000);
        playSound('success');
      }, 400);
    }, 500);

    console.log('[GeoAI v17] Source:', S.source, '| Version:', CFG.VERSION);
    console.log('[GeoAI v17] Payload meta:', S.payload.meta || Object.keys(S.payload.data).length + ' sheets');

  } catch(err){
    console.error(err);
    setBoot(100, 'เกิดข้อผิดพลาด');
    setStatus('ผิดพลาด', 'error');
    setTimeout(() => $('#boot').classList.add('hide'), 1500);
    toast('⚠ ' + err.message, 'danger', 6000);
  }
}

document.addEventListener('DOMContentLoaded', boot);
document.addEventListener('click', unlockAudio, { once: true });

window.addEventListener('resize', () => {
  const cv = $('#windCanvas');
  if(cv){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
});

/* Public API */
window.GeoAI = {

  },
  setBasemap, openBasemapModal, openAnalytics, openAIChat, openIoTPanel,
  openMultiHouseholdPDF, exportHouseholdPDF, exportMedicalUnitPDF,
  captureScreenshot, toggleLayer, toggleHeat, toggleWind, computeEvacuation,
  showCard, hideCard, getCategoriesForItem, getCaptionHint,
  reload: () => location.reload()
};

})();
