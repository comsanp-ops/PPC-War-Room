<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PhlapphlaChai 3D GeoAI Dashboard v17</title>
<base target="_top">

<!-- ═══════════════════════════════════════════════════════════════════
     LIBRARIES
     ═══════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   ROOT + RESET
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --c1:#00f0ff; --c2:#a855f7; --c3:#ff2d95; --c4:#22ff88; --c5:#ffb020;
  --glass-a:rgba(14,22,40,.72);
  --glass-b:rgba(6,10,22,.58);
  --stroke:rgba(120,200,255,.20);
  --txt:#e6f1ff; --dim:#8fa8c8;
  --ambient-transition:1500ms;
  --mx:50%; --my:50%;
  --holo-c1:#00f0ff; --holo-c2:#a855f7;
  --holo-c3:#ff2d95; --holo-c4:#22ff88;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;background:#04060c;color:var(--txt);
  font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(0,240,255,.25);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ═══ MAP + AMBIENT ═══ */
#map{position:absolute;inset:0;z-index:1;background:#04060c}
#ambientOverlay{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  transition:background var(--ambient-transition) ease;
  mix-blend-mode:soft-light;opacity:.9;
}
body[data-amb="morning"]   #ambientOverlay{background:linear-gradient(180deg,rgba(255,214,140,.35),rgba(120,200,255,.10))}
body[data-amb="afternoon"] #ambientOverlay{background:linear-gradient(180deg,rgba(255,240,190,.22),rgba(0,180,255,.08))}
body[data-amb="evening"]   #ambientOverlay{background:linear-gradient(180deg,rgba(255,120,60,.30),rgba(120,0,180,.22))}
body[data-amb="night"]     #ambientOverlay{background:linear-gradient(180deg,rgba(0,90,180,.30),rgba(60,0,120,.35))}
.leaflet-container{background:#04060c;font-family:inherit}
.leaflet-control-zoom a{
  background:rgba(8,14,28,.85)!important;color:#7dd3fc!important;
  border:1px solid rgba(0,240,255,.25)!important;backdrop-filter:blur(10px);
}
.leaflet-control-attribution{
  background:rgba(6,10,22,.75)!important;color:#8fa8c8!important;
  font-size:9px!important;backdrop-filter:blur(10px);
}
.leaflet-control-attribution a{color:#7dd3fc!important}

#windCanvas{
  position:absolute;inset:0;z-index:450;pointer-events:none;
  opacity:0;transition:opacity .7s ease;
}
#windCanvas.on{opacity:.92}

/* ═══ GLASS + HOLO ═══ */
.glass{
  background:linear-gradient(150deg,var(--glass-a),var(--glass-b));
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-radius:20px;
  border:1px solid var(--stroke);
  box-shadow:0 20px 55px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;
}
.holo{position:relative;isolation:isolate}
.holo::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:conic-gradient(from 0deg,var(--holo-c1),var(--holo-c2),var(--holo-c3),var(--holo-c4),var(--holo-c1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:holoSpin 9s linear infinite;
  pointer-events:none;opacity:.65;z-index:-1;
}
@keyframes holoSpin{to{filter:hue-rotate(360deg)}}
.hud{position:fixed;z-index:1000;transform-style:preserve-3d;will-change:transform}

/* ═══ TOPBAR ═══ */
#topbar{top:14px;left:14px;right:14px;height:62px;
  display:flex;align-items:center;gap:12px;padding:0 18px;}
.brand-badge{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;position:relative;flex:none;
  background:linear-gradient(135deg,rgba(0,240,255,.25),rgba(168,85,247,.28));
  border:1px solid rgba(0,240,255,.4);box-shadow:0 0 22px rgba(0,240,255,.35);
}
.brand-badge::after{
  content:'';position:absolute;inset:-3px;border-radius:15px;
  border:1px solid var(--c1);opacity:.5;
  animation:brandRing 2.8s ease-out infinite;pointer-events:none;
}
@keyframes brandRing{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.22);opacity:0}}
.brand-title{
  font-weight:800;font-size:15px;letter-spacing:.4px;line-height:1.15;
  background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f0abfc,#7dd3fc);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:shimmer 6s linear infinite;
}
@keyframes shimmer{to{background-position:250% 0}}
.brand-sub{font-size:10.5px;color:var(--dim);letter-spacing:1.2px;
  text-transform:uppercase;margin-top:2px}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;
  border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid rgba(34,255,136,.32);
  background:rgba(34,255,136,.10);color:#8affc2;white-space:nowrap;
}
.status-pill.error{border-color:rgba(255,45,85,.4);background:rgba(255,45,85,.12);color:#ffb3c2}
.status-pill.warn{border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.12);color:#ffe3ad}
.dot-live{width:7px;height:7px;border-radius:50%;background:#22ff88;
  box-shadow:0 0 10px #22ff88;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;
  color:#bae6fd;margin-left:8px}
#phaseLabel{font-size:9.5px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}

/* ═══ LAYER PANEL ═══ */
#layerPanel{position:fixed;top:88px;left:14px;width:320px;
  max-height:calc(100vh - 200px);display:flex;flex-direction:column;z-index:1000;}
.lc-header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;
  border-bottom:1px solid rgba(255,255,255,.08);flex:none;}
.lc-brand-badge{width:32px;height:32px;flex:none;border-radius:10px;
  display:grid;place-items:center;font-size:16px;
  background:linear-gradient(135deg,rgba(0,240,255,.24),rgba(168,85,247,.28));
  border:1px solid rgba(0,240,255,.4);}
.lc-title{font-weight:800;font-size:11.5px;letter-spacing:.5px;
  background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f0abfc,#7dd3fc);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:shimmer 6s linear infinite;}
.lc-sub{font-size:9px;color:var(--dim);letter-spacing:1.1px;
  text-transform:uppercase;margin-top:2px}
.lc-body{padding:10px 12px 12px;overflow-y:auto;flex:1}
.lc-body::-webkit-scrollbar{width:5px}
.lc-body::-webkit-scrollbar-thumb{background:rgba(0,240,255,.28);border-radius:99px}

.lc-group{margin-bottom:10px}
.lc-group-header{display:flex;align-items:center;gap:7px;
  padding:7px 8px;border-radius:9px;cursor:pointer;
  user-select:none;transition:background .2s;}
.lc-group-header:hover{background:rgba(255,255,255,.05)}
.lc-group-chevron{font-size:10px;color:#8fa8c8;transition:transform .25s;
  width:12px;text-align:center;}
.lc-group.collapsed .lc-group-chevron{transform:rotate(-90deg)}
.lc-group-icon{font-size:13px}
.lc-group-name{flex:1;font-size:10.5px;font-weight:700;
  letter-spacing:.3px;color:#bcd4ee}
.lc-group-count{font-size:9px;color:#8fa8c8;background:rgba(255,255,255,.06);
  padding:2px 7px;border-radius:99px;}
.lc-group-items{overflow:hidden;max-height:2000px;
  transition:max-height .35s cubic-bezier(.22,1,.36,1);padding-left:4px;}
.lc-group.collapsed .lc-group-items{max-height:0}

.layer-item{display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin:4px 0;border-radius:11px;
  cursor:pointer;user-select:none;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.065);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.layer-item:hover{background:rgba(255,255,255,.06);
  border-color:rgba(0,240,255,.22)}
.layer-item.on{
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--acc) 18%,transparent),rgba(255,255,255,.02));
  border-color:color-mix(in srgb,var(--acc) 45%,transparent);
}
.layer-icon{font-size:15px;width:20px;text-align:center;flex:none}
.layer-name{flex:1;font-size:11.3px;font-weight:600;color:#dceaff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-count{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.09);color:#cbd5e1;
  font-variant-numeric:tabular-nums;flex:none;}
.layer-switch{width:28px;height:15px;border-radius:99px;background:rgba(255,255,255,.14);
  position:relative;transition:background .25s;flex:none;}
.layer-switch::after{content:'';position:absolute;top:2px;left:2px;
  width:11px;height:11px;border-radius:50%;background:#94a3b8;
  transition:all .28s cubic-bezier(.34,1.56,.64,1);}
.layer-item.on .layer-switch{background:color-mix(in srgb,var(--acc) 60%,transparent);}
.layer-item.on .layer-switch::after{left:15px;background:#fff;box-shadow:0 0 8px var(--acc);}

/* ═══ DOCK ═══ */
#dock{bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;padding:9px 12px;align-items:center;
  flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 28px);}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 14px;border-radius:14px;cursor:pointer;min-width:68px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  transition:transform .24s cubic-bezier(.34,1.56,.64,1),
    background .2s, box-shadow .2s;}
.dock-btn:hover{transform:translateY(-4px) scale(1.05);
  background:rgba(0,240,255,.13);box-shadow:0 10px 26px -8px #00f0ff}
.dock-btn:active{transform:scale(.93)}
.dock-btn .di{font-size:17px}
.dock-btn .dl{font-size:9px;letter-spacing:.4px;color:#bcd4ee;white-space:nowrap}
.dock-btn.danger{border-color:rgba(255,45,85,.35);background:rgba(255,45,85,.10)}

/* ═══ MARKERS ═══ */
.geoai-pin .pin{position:relative;display:grid;place-items:center}
.geoai-pin .pin-dot{border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),var(--c) 72%);
  border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 12px var(--c),0 0 22px -4px var(--c);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
.geoai-pin:hover .pin-dot{transform:scale(1.3)}
.pulse-ring{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
  border-radius:50%;border:2px solid var(--c,#ff2d55);
  animation:ringPulse 1.9s cubic-bezier(.22,.61,.36,1) infinite;
  pointer-events:none;}
.pulse-ring.d2{animation-delay:.65s}
@keyframes ringPulse{0%{transform:scale(.35);opacity:.95}80%{opacity:0}100%{transform:scale(3);opacity:0}}
.geoai-cluster .cluster-badge{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,rgba(125,211,252,.9),rgba(6,14,28,.95) 72%);
  border:2px solid rgba(0,240,255,.65);box-shadow:0 0 22px -2px #00f0ff;
  color:#e6f1ff;font-weight:800;font-size:12px;}
.geoai-cluster .cluster-badge.tier-medium{
  background:radial-gradient(circle at 35% 28%,rgba(196,181,253,.9),rgba(6,14,28,.95) 72%);
  border-color:rgba(168,85,247,.7);}
.geoai-cluster .cluster-badge.tier-large{
  background:radial-gradient(circle at 35% 28%,rgba(255,176,32,.95),rgba(6,14,28,.95) 72%);
  border-color:rgba(255,107,0,.75);}
.geoai-tooltip{background:rgba(10,18,34,.94)!important;
  border:1px solid rgba(0,240,255,.45)!important;
  color:#e6f1ff!important;font-size:11px!important;font-weight:600!important;
  padding:6px 10px!important;border-radius:9px!important;}
.geoai-tooltip::before{display:none!important}

/* ═══ CARD ═══ */
#cardHost{position:fixed;left:0;top:0;z-index:1400;pointer-events:none;display:none}
.card{width:380px;max-width:calc(100vw - 28px);border-radius:20px;overflow:hidden;
  background:linear-gradient(155deg,rgba(16,24,44,.94),rgba(6,10,22,.86));
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(130,205,255,.28);
  box-shadow:0 28px 70px rgba(0,0,0,.72),0 0 45px -14px var(--acc);
  pointer-events:auto;opacity:0;transform:scale(.9) translateY(20px);
  transition:opacity .32s ease,transform .42s cubic-bezier(.18,1.45,.42,1);}
.card.in{opacity:1;transform:scale(1) translateY(0)}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:14px 15px 12px;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--acc) 26%,transparent),transparent 78%);
  border-bottom:1px solid rgba(255,255,255,.08);}
.card-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  font-size:19px;flex:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),var(--acc) 85%);
  border:1px solid rgba(255,255,255,.28);}
.card-title{font-size:13.5px;font-weight:800;color:#eaf4ff;line-height:1.3}
.card-badge{display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  background:color-mix(in srgb,var(--acc) 24%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);
  color:#eaf6ff;margin-top:4px;}
.card-close{margin-left:auto;width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;font-size:12px;color:#9fb6d1;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;flex:none;transition:all .2s;}
.card-close:hover{background:rgba(255,45,85,.28);color:#fff;transform:rotate(90deg)}
.card-body{padding:0;max-height:74vh;overflow-y:auto;overflow-x:hidden}
.card-body::-webkit-scrollbar{width:5px}

/* 🆕 Phase 17 — House Number */
.card-housenumber{
  display:inline-flex;align-items:center;gap:5px;
  margin:4px 0 6px 0;font-size:11px;font-weight:600;color:#7dd3fc;
  letter-spacing:.2px;line-height:1.3;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-housenumber .hn-icon{font-size:12px;
  filter:drop-shadow(0 0 6px rgba(125,211,252,.5));flex:none;}
.card-housenumber .hn-zone{color:#8fa8c8;font-weight:500;}
.card-housenumber .hn-sep{color:#475569;margin:0 2px;}
@media (max-width:640px){
  .card-housenumber{white-space:normal;word-break:break-word;}
}

.kv{display:flex;justify-content:space-between;gap:12px;
  padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06);
  font-size:11.3px;line-height:1.5;}
.kv:last-child{border-bottom:none}
.kv .k{color:#8fa8c8;flex:none}
.kv .v{font-weight:600;color:#e8f4ff;text-align:right;word-break:break-word}
.kv-tel{color:#7dd3fc;text-decoration:none;font-weight:700}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:10px;font-weight:700;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);}
.kv-chip.danger .chip{background:rgba(255,45,85,.16);border-color:rgba(255,45,85,.48);color:#ffb3c2}
.kv-chip.warn .chip{background:rgba(255,176,32,.16);border-color:rgba(255,176,32,.5);color:#ffe3ad}
.kv-chip.calm .chip{background:rgba(34,255,136,.14);border-color:rgba(34,255,136,.4);color:#a7ffd0}

.risk-meter{margin:12px 0 4px;padding:0 16px}
.risk-meter-head{display:flex;justify-content:space-between;
  font-size:10px;color:#8fa8c8;margin-bottom:6px;letter-spacing:.5px}
.risk-meter-head b{font-size:13px;color:var(--risk-c);
  font-variant-numeric:tabular-nums}
.risk-meter-track{height:8px;border-radius:99px;
  background:rgba(255,255,255,.08);overflow:hidden}
.risk-meter-fill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--risk-c) 40%,#22ff88),var(--risk-c));
  box-shadow:0 0 18px -2px var(--risk-c);
  transition:width 1s cubic-bezier(.22,1,.36,1);}
.insight{margin:12px 16px;padding:10px 12px;border-radius:12px;
  font-size:11.2px;line-height:1.55;display:flex;gap:9px;align-items:flex-start;}
.insight-danger{background:linear-gradient(135deg,rgba(255,45,85,.16),rgba(255,107,0,.10));
  border:1px solid rgba(255,45,85,.4);color:#ffc9d2}
.insight-warn{background:linear-gradient(135deg,rgba(255,176,32,.14),rgba(255,107,0,.06));
  border:1px solid rgba(255,176,32,.36);color:#ffe3ad}
.insight-calm{background:linear-gradient(135deg,rgba(34,255,136,.11),rgba(0,240,255,.06));
  border:1px solid rgba(34,255,136,.32);color:#a7ffd0}
.insight-ico{font-size:15px;line-height:1;flex:none}

.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px 16px 16px}
.act{padding:9px 8px;border-radius:11px;font-size:10.5px;font-weight:700;
  text-align:center;color:#dceaff;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s;}
.act:hover{transform:translateY(-2px) scale(1.03);
  background:rgba(0,240,255,.16);box-shadow:0 8px 20px -10px #00f0ff}
.act.full{grid-column:1/-1}
.act.go{border-color:rgba(34,255,136,.42);background:rgba(34,255,136,.13);color:#a7ffd0}
.act.sos{border-color:rgba(255,45,85,.45);background:rgba(255,45,85,.15);color:#ffb3c4}
.act.pdf-act{
  border-color:rgba(168,85,247,.45);
  background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(0,240,255,.12));
  color:#e0d5ff;}

/* ═══ TABS ═══ */
.card-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;
  background:linear-gradient(180deg,rgba(16,24,44,.98),rgba(16,24,44,.92));
  backdrop-filter:blur(20px);z-index:5;overflow-x:auto;scrollbar-width:none;}
.card-tabs::-webkit-scrollbar{display:none}
.card-tab{padding:11px 10px;font-size:10.5px;font-weight:700;color:#8fa8c8;
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  transition:all .22s;font-family:inherit;background:none;
  display:inline-flex;align-items:center;gap:4px;}
.card-tab:hover{color:#dceaff;background:rgba(0,240,255,.06)}
.card-tab.active{color:#00f0ff;border-bottom-color:#00f0ff;
  text-shadow:0 0 12px rgba(0,240,255,.5)}
.tab-count{font-size:9px;font-weight:800;padding:1.5px 5px;border-radius:99px;

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}

.tab-empty{text-align:center;padding:40px 20px;color:#8fa8c8;

/* Lightbox */
.lightbox-backdrop{position:fixed;inset:0;z-index:5000;

.camera-category-select option{background:#0e1628}

function registerTilt(el){

    S.tilt.cx += (S.tilt.mx - S.tilt.cx) * 0.14;
    S.tilt.cy += (S.tilt.my - S.tilt.cy) * 0.14;
    S.tilt.items.forEach(el => {
      const t = el._tilt;
      if(!t || !el.isConnected) return;
      const r = el.getBoundingClientRect();
      const dx = clamp((S.tilt.cx - (r.left + r.width/2)) / (window.innerWidth/2), -1, 1);

      t.cx += (t.tx - t.cx) * 0.14; t.cy += (t.ty - t.cy) * 0.14;
      if(Math.abs(t.cx) < 0.01 && Math.abs(t.cy) < 0.01){ el.style.transform = ''; return; }

function normalize(payload){
  const d = (payload && payload.data) ? payload.data : {};
  const out = { ok:true, center: payload.center || CFG.CENTER,
                generatedAt: payload.generatedAt || new Date().toISOString(), data:{} };
  const numF = {
    Households:['lat','lng','members','elderly','bedridden','riskLevel'],
    Bedridden:['lat','lng','age'], Emergency:['lat','lng','severity'],
    Shelters:['lat','lng','capacity','current'], IoT:['lat','lng'],
    Landmarks:['lat','lng'], CarbonSink:['areaRai','biomassTon','co2Ton'],
    VulnerableHouseholds:['lat','lng','members'], SpecialNeeds:['lat','lng'],
    MedicalUnits:['lat','lng','capacity','ambulances'],
    WaterPoints:['lat','lng','capacity','flow_rate'], RoadClosures:['depth'],
    AgriculturalPlots:['area_rai','yield_estimate'],
    EducationalSites:['lat','lng','students'],
    GasStations:['lat','lng','price_95'], LocalShops:['lat','lng']
  };
  const jsonF = {
    RiskZones:['polygon'], Utilities:['path'], CarbonSink:['polygon'],
    RoadClosures:['path'], AgriculturalPlots:['polygon'],
    Households:['photos','members_detail','chronic_patients','pets','vehicles'],
    Landmarks:['photos'], LocalShops:['photos'],
    EducationalSites:['photos'], MedicalUnits:['photos']
  };
  Object.keys(d).forEach(k => {
    const rows = Array.isArray(d[k]) ? d[k] : [];
    out.data[k] = rows.map(r => {
      const o = Object.assign({}, r);
      (numF[k]||[]).forEach(f => { if(f in o) o[f] = num(o[f]); });
      (jsonF[k]||[]).forEach(f => {
        if(typeof o[f] === 'string' && o[f].trim().startsWith('[')){
          try { o[f] = JSON.parse(o[f]); } catch(e){ o[f] = []; }
        }
        if(!Array.isArray(o[f])) o[f] = [];
      });
      return o;
    });
  });
  return out;
}

let currentBasemapId = 'carto-dark';

function setBasemap(id){
  const bm = BASEMAPS[id];
  if(!bm) return;
  S.map.eachLayer(l => { if(l._isBasemap) l.setOpacity(0); });
  if(bm.url){
    const newLayer = L.tileLayer(bm.url, { maxZoom: 19, subdomains: bm.subs || '' });
    newLayer._isBasemap = true;
    newLayer._basemapId = id;
    newLayer.setOpacity(0);
    newLayer.addTo(S.map);
    requestAnimationFrame(() => newLayer.setOpacity(1));
  }
  setTimeout(() => {
    S.map.eachLayer(l => {
      if(l._isBasemap && l._basemapId !== id){
        try { S.map.removeLayer(l); } catch(e){}
      }
    });
  }, 550);
  currentBasemapId = id;
  try { localStorage.setItem('geoai_basemap', id); } catch(e){}
  playSound('on');
  toast(`${bm.icon} ${bm.name}`, 'info', 2000);
}

function restoreBasemap(){
  let saved = null;
  try { saved = localStorage.getItem('geoai_basemap'); } catch(e){}
  const id = (saved && BASEMAPS[saved]) ? saved : 'carto-dark';
  setBasemap(id);
}

  const existing = $('#basemapModal');
  if(existing){ existing.remove(); return; }
  const groups = {};
  Object.entries(BASEMAPS).forEach(([id, bm]) => {
    const cat = bm.category || 'default';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push({ id, ...bm });
  });
  const sorted = Object.keys(groups).sort((a, b) =>
    (BM_CATS[a]?.order || 99) - (BM_CATS[b]?.order || 99));

  const backdrop = document.createElement('div');
  backdrop.id = 'basemapModal';
  backdrop.className = 'bm-backdrop';
  backdrop.innerHTML = `
    <div class="bm-modal">

/* ═══════════════════════════════════════════════════════════════════════
   MAP INIT + MARKERS
   ═══════════════════════════════════════════════════════════════════════ */
function initMap(){
  S.map = L.map('map', {
    zoomControl: false, preferCanvas: false,
    zoomSnap: 0.5, wheelPxPerZoomLevel: 110
  }).setView([CFG.CENTER.lat, CFG.CENTER.lng], CFG.ZOOM);
  L.control.zoom({ position: 'bottomright' }).addTo(S.map);
  S.map.on('click', hideCard);
}

function makePin(color, emoji, pulse, size){
  size = size || 30;
  return L.divIcon({
    className:'geoai-pin',
    iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:`<div class="pin" style="--c:${color};width:${size}px;height:${size}px">
      ${pulse ? '<span class="pulse-ring"></span><span class="pulse-ring d2"></span>' : ''}
      <span class="pin-dot" style="width:${size*.7}px;height:${size*.7}px;font-size:${size*.35}px">${emoji}</span>
    </div>`
  });
}

function makeCluster(){
  return L.markerClusterGroup({
    maxClusterRadius: 52, disableClusteringAtZoom: 17,
    showCoverageOnHover: false,
    iconCreateFunction: c => {
      const n = c.getChildCount();
      const tier = n<10?'small':n<100?'medium':'large';
      const size = n<10?38:n<100?44:52;
      return L.divIcon({
        html:`<div class="cluster-badge tier-${tier}"><span>${n}</span></div>`,
        className:'geoai-cluster', iconSize:L.point(size,size)
      });
    }
  });
}

function buildMarkerLayer(def, items){
  const group = (def.key === 'Households') ? makeCluster() : L.layerGroup();
  const markers = [];
  items.forEach(item => {
    const lat = num(item.lat), lng = num(item.lng);
    if(!isFinite(lat) || !isFinite(lng) || (!lat && !lng)) return;
    let color = def.color, icon = def.icon, pulse = def.pulse || false;
    if(def.key === 'Households'){
      const risk = num(item.riskLevel);
      color = risk>=70 ? '#ff2d55' : risk>=45 ? '#ffb020' : '#38bdf8';
      pulse = risk >= 70;
    }
    if(def.key === 'IoT') icon = IOT_ICON[item.type] || icon;
    const m = L.marker([lat, lng], {
      icon: makePin(color, icon, pulse, pulse ? 34 : 30),
      title: item.name || '', riseOnHover: true,
      zIndexOffset: def.key === 'Emergency' ? 600 : def.key === 'SpecialNeeds' ? 500 : def.key === 'Bedridden' ? 400 : 0
    });
    /* Phase 17 — Tooltip ใส่ houseNumber */
    const hnTip = (def.key === 'Households' && item.houseNumber && item.houseNumber !== '—')
      ? `<br><span style="color:#7dd3fc;font-size:10px;font-weight:600">🏠 ${esc(item.houseNumber)}</span>`
      : '';
    m.bindTooltip(`<b>${esc(item.name || def.label)}</b>${hnTip}`,
      { direction:'top', className:'geoai-tooltip' });
    m.on('click', ev => {
      L.DomEvent.stopPropagation(ev);
      showCard(def, item, m.getLatLng());
    });
    group.addLayer(m);
    markers.push({ marker: m, item });
  });
  return { group, markers };
}

function buildPolygonLayer(def, items){
  const group = L.layerGroup();
  const markers = [];
  items.forEach(item => {
    const pts = safeArr(item.polygon || item.path);
    if(pts.length < 2) return;
    if(def.type === 'polyline'){
      let color = def.color;
      if(def.key === 'Utilities'){
        color = { water:'#06b6d4', drain:'#64748b', power:'#facc15', fiber:'#a855f7' }[item.type] || '#06b6d4';
      } else if(def.key === 'RoadClosures'){
        color = item.severity === 'critical' ? '#ff2d55' : item.severity === 'high' ? '#ff6b00' : '#ffb020';
      }
      const line = L.polyline(pts, {
        color, weight: 4, opacity:.95,
        dashArray: def.key === 'Utilities' ? '10 12' : '8 8',
        lineCap:'round'
      });
      line.bindTooltip(`<b>${esc(item.name)}</b>`, { sticky:true, className:'geoai-tooltip' });
      line.on('click', ev => { L.DomEvent.stopPropagation(ev); showCard(def, item, ev.latlng); });
      group.addLayer(line);
    } else {
      const color = def.key === 'CarbonSink' ? '#16a34a'
                  : def.key === 'AgriculturalPlots' ? '#22c55e'
                  : '#38bdf8';
      const poly = L.polygon(pts, {
        color, fillColor: color, weight: 2, fillOpacity: .20, dashArray: '8 6'
      });
      poly.bindTooltip(`<b>${esc(item.name)}</b>`, { sticky:true, className:'geoai-tooltip' });
      poly.on('click', ev => { L.DomEvent.stopPropagation(ev); showCard(def, item, ev.latlng); });
      group.addLayer(poly);
      const c = [
        pts.reduce((s,p) => s + num(p[0]), 0) / pts.length,
        pts.reduce((s,p) => s + num(p[1]), 0) / pts.length
      ];
      group.addLayer(L.marker(c, { icon: makePin(color, def.icon, false, 26), interactive: false }));
    }
  });
  return { group, markers };
}

function buildAllLayers(){
  S.groups = {}; S.markers = {}; S.visible = {};
  LAYER_DEFS.forEach(def => {
    const items = (S.payload.data[def.key] || []);
    let built;
    if(def.type === 'polygon' || def.type === 'polyline'){
      built = buildPolygonLayer(def, items);
    } else {
      built = buildMarkerLayer(def, items);
    }
    S.groups[def.key] = built.group;
    S.markers[def.key] = built.markers;
    S.visible[def.key] = true;
    built.group.addTo(S.map);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   LAYER PANEL
   ═══════════════════════════════════════════════════════════════════════ */
function renderLayerPanel(){
  const host = $('#lcBody');
  const d = S.payload.data;
  let total = 0;
  let html = '';
  GROUP_DEFS.forEach(g => {
    const layers = LAYER_DEFS.filter(l => l.group === g.id);
    if(!layers.length) return;
    html += `
      <div class="lc-group" data-group="${g.id}">
        <div class="lc-group-header" data-toggle-group="${g.id}">
          <span class="lc-group-chevron">▼</span>
          <span class="lc-group-icon">${g.icon}</span>
          <span class="lc-group-name">${g.name}</span>
          <span class="lc-group-count">${layers.length}</span>
        </div>
        <div class="lc-group-items">
          ${layers.map(l => {
            const count = (d[l.key] || []).length;
            total += count;
            return `
              <div class="layer-item ${S.visible[l.key] ? 'on' : ''}"
                   data-layer="${l.key}" style="--acc:${l.color}">
                <span class="layer-icon">${l.icon}</span>
                <span class="layer-name">${l.label}</span>
                <span class="layer-count">${count}</span>
                <span class="layer-switch"></span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  });
  host.innerHTML = html;
  $('#lcSub').textContent = `${LAYER_DEFS.length} ชั้น · ${fmt(total)} features`;

  host.querySelectorAll('[data-toggle-group]').forEach(el => {
    el.addEventListener('click', () => {
      el.closest('.lc-group').classList.toggle('collapsed');
    });
  });
  host.querySelectorAll('.layer-item').forEach(el => {
    el.addEventListener('click', () => toggleLayer(el.dataset.layer));
  });
}

function toggleLayer(key){
  const newVis = !S.visible[key];
  S.visible[key] = newVis;
  const g = S.groups[key];
  if(!g) return;
  if(newVis) g.addTo(S.map);
  else S.map.removeLayer(g);
  const el = document.querySelector(`.layer-item[data-layer="${key}"]`);
  if(el) el.classList.toggle('on', newVis);
  playSound(newVis ? 'on' : 'off');
}

  const badges = [];

  if(m.age <= 14) badges.push({ icon:'👶', label:'เด็ก', color:'#7dd3fc' });
  if(m.pregnant) badges.push({ icon:'🤰', label:`ตั้งครรภ์ ${m.pregnantWeeks||''} wk`, color:'#f472b6' });
  if(m.disabled) badges.push({ icon:'♿', label:'ผู้พิการ', color:'#a855f7' });
  if(m.needsElectricity) badges.push({ icon:'⚡', label:'ใช้ไฟฟ้า', color:'#ffb020' });
  if(m.chronic) badges.push({ icon:'🩺', label:m.chronic, color:'#ff6b00' });

    </div>
    <div class="card-tab-content active" data-content="overview">${tabOverview}</div>
    <div class="card-tab-content" data-content="members">${tabMembers}</div>
    <div class="card-tab-content" data-content="health">${tabHealth}</div>
    <div class="card-tab-content" data-content="map">${tabMap}</div>
    <div class="card-tab-content" data-content="gallery">${tabGallery}</div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════
   PHASE 17 — Generic Gallery Tabs (Landmarks/LocalShops/Edu/Medical)
   ═══════════════════════════════════════════════════════════════════════ */
function renderGalleryTabs(def, item){
  const fields = cardFields(def.key, item).filter(f => f[1] != null && f[1] !== '');
  const photos = parseJSONField(item.photos, []);

  /* ── Readiness Score (เฉพาะ EducationalSites) ── */
  const readinessHTML = def.key === 'EducationalSites'
    ? (() => {
        const wanted = ['building','classroom','facility','signage'];
        const have = new Set(photos.map(p => p.category));
        const found = wanted.filter(w => have.has(w));
        const pct = Math.round(found.length / wanted.length * 100);
        const cls = pct >= 75 ? 'calm' : pct >= 50 ? 'warn' : 'danger';
        const icon = pct >= 75 ? '✅' : pct >= 50 ? '⚠️' : '❌';
        const missing = wanted.filter(w => !have.has(w));
        const missingLabels = {
          building:'อาคารเรียน', classroom:'ห้องเรียน',
          facility:'สนาม/โรงอาหาร', signage:'ป้ายโรงเรียน'
        };
        return `
          <div class="insight insight-${cls}" style="margin:12px 0">
            <span class="insight-ico">${icon}</span>
            <div style="flex:1">
              <div style="font-weight:700;font-size:11.5px">
                Readiness: ${pct}% (${found.length}/${wanted.length} หมวด)
              </div>
              <div style="font-size:10.5px;margin-top:3px;opacity:.85">
                ${missing.length
                  ? 'ขาด: ' + missing.map(m => missingLabels[m]).join(' · ')
                  : 'ครบทุกหมวด ✓ พร้อมประเมิน'}
              </div>
            </div>
          </div>`;
      })()
    : '';

  /* ── Capacity Verification (เฉพาะ MedicalUnits) ── */
  const capacityHTML = def.key === 'MedicalUnits'
    ? (() => {
        const have = new Set(photos.map(p => p.category));
        const totalWeight = Object.values(MEDICAL_VERIFICATION_CATEGORIES)
          .reduce((s, c) => s + c.weight, 0);
        const earnedWeight = Object.entries(MEDICAL_VERIFICATION_CATEGORIES)
          .filter(([k]) => have.has(k))
          .reduce((s, [, c]) => s + c.weight, 0);
        const pct = Math.round(earnedWeight / totalWeight * 100);
        const cls = pct >= 80 ? 'calm' : pct >= 50 ? 'warn' : 'danger';
        const icon = pct >= 80 ? '✅' : pct >= 50 ? '⚠️' : '❌';
        const missing = Object.entries(MEDICAL_VERIFICATION_CATEGORIES)
          .filter(([k, c]) => c.required && !have.has(k))
          .map(([, c]) => c.label);
        const capacity = num(item.capacity) || 0;
        const ambulances = num(item.ambulances) || 0;
        return `
          <div class="insight insight-${cls}" style="margin:12px 0">
            <span class="insight-ico">${icon}</span>
            <div style="flex:1">
              <div style="font-weight:700;font-size:11.5px">Capacity Verification: ${pct}%</div>
              <div style="font-size:10.5px;margin-top:3px;opacity:.85">
                ${missing.length
                  ? 'ขาดหลักฐาน: ' + missing.join(' · ')
                  : 'มีหลักฐานครบ ✓ ยืนยันศักยภาพได้'}
              </div>
              <div style="font-size:10.5px;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.15);opacity:.9">
                📊 อ้างสิทธิ์: <b>${capacity} เตียง</b> · <b>${ambulances} รถกู้ชีพ</b>
              </div>
            </div>
          </div>`;
      })()
    : '';

  const tabOverview = `
    <div class="kv">
      <span class="k">ประเภท</span>
      <span class="v"><span class="chip">${esc(item.type || '-')}</span></span>
    </div>
    ${fields.filter(f => f[0] !== 'ประเภท').map(f => {
      const opts = f[2] || {};
      const cls = ['kv'];
      if(opts.chip) cls.push('kv-chip');
      if(opts.danger) cls.push('danger');
      if(opts.warn) cls.push('warn');
      if(opts.calm) cls.push('calm');
      let vHTML = esc(f[1]);
      if(opts.contact === 'phone' && f[1] && f[1] !== '-'){
        vHTML = `<a class="kv-tel" href="tel:${String(f[1]).replace(/[^0-9+]/g,'')}">📞 ${esc(f[1])}</a>`;
      } else if(opts.chip){
        vHTML = `<span class="chip">${esc(f[1])}</span>`;
      }
      return `<div class="${cls.join(' ')}"><span class="k">${esc(f[0])}</span><span class="v">${vHTML}</span></div>`;
    }).join('')}
    <div class="kv">
      <span class="k">พิกัด</span>
      <span class="v" style="font-family:monospace;font-size:10.5px">${num(item.lat).toFixed(5)}, ${num(item.lng).toFixed(5)}</span>
    </div>
    <div class="tab-section-title" style="margin-top:14px">🗺️ แผนที่ย่อ</div>
    <div class="mini-map-wrap">
      <div id="miniMap-${esc(item.id)}" class="mini-map"
           data-lat="${num(item.lat)}" data-lng="${num(item.lng)}"></div>
    </div>
  `;

  const tabGallery = `
    ${readinessHTML}
    ${capacityHTML}
    <div class="tab-section-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>🖼️ ภาพถ่าย (${photos.length})</span>
      <div style="display:flex;gap:5px">
        <button class="gallery-upload-btn" data-camera="${esc(item.id)}" data-layer="${esc(def.key)}"><span>📸</span> ถ่ายภาพ</button>
        <button class="gallery-upload-btn" data-upload="${esc(item.id)}" data-layer="${esc(def.key)}"><span>📁</span> อัปโหลด</button>
      </div>
    </div>
    ${photos.length ? `
      <div class="gallery-grid">
        ${photos.map(p => `
          <div class="gallery-item" data-photo-id="${esc(p.id)}" data-url="${esc(p.url)}">
            <img src="${esc(p.url)}" alt="${esc(p.caption||'')}" loading="lazy" onerror="this.style.opacity='.3'">
            <div class="gallery-caption">
              <div class="gallery-caption-title">${esc(p.caption || 'ไม่มีคำอธิบาย')}</div>
              <div class="gallery-caption-meta">${esc(getCategoryLabel(def.key, item, p.category))}</div>
            </div>
            <button class="gallery-delete" data-delete="${esc(p.id)}" data-hh="${esc(item.id)}" data-layer="${esc(def.key)}">✕</button>
          </div>
        `).join('')}
      </div>
    ` : `<div class="tab-empty">
      <div style="font-size:48px;margin-bottom:10px">🖼️</div>
      <div style="font-weight:700">ยังไม่มีภาพถ่าย</div>
      <div style="font-size:10.5px;color:#64748b;margin-top:6px">คลิก "ถ่ายภาพ" หรือ "อัปโหลด"</div>
    </div>`}
  `;

  return `
    <div class="card-tabs">
      <button class="card-tab active" data-tab="overview">📋 ภาพรวม</button>
      <button class="card-tab" data-tab="gallery">🖼️ ภาพ${photos.length?` <span class="tab-count">${photos.length}</span>`:''}</button>
    </div>
    <div class="card-tab-content active" data-content="overview">${tabOverview}</div>
    <div class="card-tab-content" data-content="gallery">${tabGallery}</div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════
   CARD FIELDS (per layer)
   ═══════════════════════════════════════════════════════════════════════ */
function cardFields(key, r){
  const map = {
    Bedridden: () => [
      ['ผู้ป่วย', r.patient], ['อายุ', fmt(r.age)+' ปี'],
      ['ภาวะ', r.condition], ['ผู้ดูแล', r.caregiver], ['อุปกรณ์', r.device],
      ['โทร', r.phone, { contact:'phone' }],
      ['สถานะ', r.status, { chip:true, danger:r.status==='เฝ้าระวัง' }]
    ],
    Emergency: () => [
      ['ระดับ', fmt(r.severity)+'/5'],
      ['รายละเอียด', r.detail],
      ['สถานะ', r.status, { chip:true, warn:r.status==='กำลังดำเนินการ' }],
      ['เวลา', timeAgo(r.time)]
    ],
    Shelters: () => {
      const free = Math.max(0, num(r.capacity)-num(r.current));
      return [
        ['ประเภท', r.type], ['ความจุ', fmt(r.capacity)+' คน'],
        ['พักพิง', fmt(r.current)+' คน'],
        ['ที่ว่าง', fmt(free)+' คน', { chip:true, danger:free<30, warn:free<100 }],
        ['สิ่งอำนวย', r.facilities], ['โทร', r.phone, { contact:'phone' }]
      ];
    },
    RiskZones: () => [
      ['ระดับ', r.level, { chip:true, danger:r.level==='สูง' }],
      ['ประเภท', r.type], ['หมายเหตุ', r.note]
    ],
    IoT: () => [
      ['ประเภท', r.type],
      ['ค่าล่าสุด', r.value+' '+(r.unit||''), { chip:true }],
      ['สถานะ', r.status, { chip:true, danger:r.status==='เฝ้าระวัง', calm:r.status==='ปกติ' }]
    ],
    Utilities: () => [
      ['ประเภท', r.type], ['ความลึก', r.depth+' ม.'],
      ['วัสดุ', r.material], ['สถานะ', r.status, { chip:true, calm:r.status==='ปกติ' }]
    ],
    CarbonSink: () => [
      ['ประเภท', r.type], ['พื้นที่', fmt(r.areaRai)+' ไร่'],
      ['ชีวมวล', fmt(r.biomassTon)+' ตัน'],
      ['CO₂', r.co2Ton+' tCO₂e', { chip:true, calm:true }], ['พันธุ์ไม้', r.species]
    ],
    Landmarks: () => [
      ['รายละเอียด', r.detail], ['โทร', r.phone, { contact:'phone' }]
    ],
    VulnerableHouseholds: () => [
      ['ประเภท', r.type], ['สมาชิก', fmt(r.members)+' คน'],
      ['ความต้องการ', r.needs],
      ['ผู้ดูแล', r.caregiver && r.caregiver !== '-' ? r.caregiver : 'ไม่มี'],
      ['ความสำคัญ', r.priority === 'high' ? '🔴 สูง' : r.priority === 'medium' ? '🟡 กลาง' : '🟢 ปกติ',
        { chip:true, danger:r.priority==='high' }],
      ['โทร', r.phone, { contact:'phone' }]
    ],
    SpecialNeeds: () => [
      ['ภาวะ', r.condition], ['การเคลื่อนย้าย', r.mobility], ['อุปกรณ์', r.device],
      ['ความสำคัญ', r.priority === 'critical' ? '🚨 วิกฤต' : '🔴 สูง',
        { chip:true, danger:r.priority==='critical' }],
      ['ติดต่อ', r.contact, { contact:'phone' }]
    ],
    MedicalUnits: () => [
      ['ความจุ', fmt(r.capacity)+' เตียง'],
      ['รถพยาบาล', fmt(r.ambulances)+' คัน'],
      ['สถานะ', r.status, { chip:true, calm:true }],
      ['โทร', r.phone, { contact:'phone' }]
    ],
    WaterPoints: () => [
      ['ประเภท', r.type], ['ความจุ', fmt(r.capacity)+' ลิตร'],
      ['อัตราจ่าย', fmt(r.flow_rate)+' ลิตร/นาที'],
      ['สถานะ', r.status, { chip:true, calm:true }], ['โทร', r.phone, { contact:'phone' }]
    ],
    RoadClosures: () => [
      ['ประเภท', r.type], ['ระดับน้ำ', r.depth ? r.depth+' ม.' : '—'],
      ['ความรุนแรง', r.severity === 'critical' ? '🚨 วิกฤต' : r.severity === 'high' ? '🔴 สูง' : '🟡 กลาง',
        { chip:true, danger:r.severity==='critical' }],
      ['เริ่มเมื่อ', timeAgo(r.started_at)], ['หมายเหตุ', r.note]
    ],
    AgriculturalPlots: () => [
      ['ชนิดพืช', r.crop], ['พื้นที่', fmt(r.area_rai)+' ไร่'],
      ['เจ้าของ', r.owner], ['ผลผลิตคาดการณ์', fmt(r.yield_estimate)+' กก.'],
      ['โทร', r.phone, { contact:'phone' }]
    ],
    EducationalSites: () => [
      ['ระดับชั้น', r.levels],
      ['จำนวนนักเรียน', fmt(r.students)+' คน'],
      ['ผู้อำนวยการ', r.director],
      ['สถานะ', r.status, { chip:true, calm:r.status==='เปิด' }],
      ['โทร', r.phone, { contact:'phone' }]
    ],
    GasStations: () => [
      ['แบรนด์', r.brand], ['น้ำมัน', r.fuel_available],
      ['ราคา 95', r.price_95+' บาท/ลิตร'], ['เวลาทำการ', r.open_hours],
      ['สถานะ', r.status, { chip:true, calm:r.status==='เปิด' }], ['โทร', r.phone, { contact:'phone' }]
    ],
    LocalShops: () => [
      ['สินค้า', r.products], ['เจ้าของ', r.owner],
      ['เวลาทำการ', r.opening_hours], ['โทร', r.phone, { contact:'phone' }]
    ]
  };
  return (map[key] || (() => []))();
}

function buildInsight(key, item, risk){
  if(key === 'Emergency') return `เหตุฉุกเฉินระดับ ${item.severity}/5 — แนะนำส่งชุดปฏิบัติการ`;
  if(key === 'Bedridden') return `ผู้ป่วยติดเตียง · Priority 1 · ต้องเคลื่อนย้ายด้วยเปล`;
  if(key === 'SpecialNeeds') return `${item.condition} · ต้องอพยพก่อน`;
  if(key === 'VulnerableHouseholds') return `${item.type} · ${item.needs}`;
  if(key === 'Households'){
    if(risk >= 70) return `บ้านในโซนเสี่ยงสูง · เตรียมอพยพล่วงหน้า`;
    if(risk >= 45) return `ระดับปานกลาง · ติดตามประกาศ`;
    return `ความเสี่ยงต่ำ`;
  }
  if(key === 'Shelters'){
    const free = Math.max(0, num(item.capacity) - num(item.current));
    return free < 30 ? `ที่ว่างเหลือ ${free} คน · เปิดศูนย์สำรอง` : `พร้อมรับ ${free} คน`;
  }
  if(key === 'RoadClosures') return `ถนนปิด · เลี่ยงเส้นทางนี้`;
  if(key === 'MedicalUnits') return `พร้อมให้บริการ · ${num(item.capacity)} เตียง · ${num(item.ambulances)} รถกู้ชีพ`;
  if(key === 'EducationalSites') return item.status === 'เปิด' ? `เปิดทำการ · ${num(item.students)} นักเรียน` : `ปิดชั่วคราว`;
  if(key === 'Landmarks') return `${item.type || 'สถานที่'} · ${item.detail || 'พร้อมใช้งาน'}`;
  if(key === 'LocalShops') return `${item.type} · ${item.opening_hours || 'พร้อมขาย'}`;
  return 'ข้อมูลพร้อมใช้งาน';
}

/* ═══════════════════════════════════════════════════════════════════════
   CARD SHOW/HIDE
   ═══════════════════════════════════════════════════════════════════════ */
function showCard(def, item, latlng){
  const host = $('#cardHost');
  host.style.display = 'block';
  const isHousehold = def.key === 'Households';
  const hasGallery = def.hasGallery === true || isHousehold;
  const risk = clamp(num(item.riskLevel) || 0, 0, 100);
  const insightCls = risk >= 70 || item.priority === 'critical' ? 'danger' : risk >= 45 ? 'warn' : 'calm';
  const insightIco = insightCls === 'danger' ? '⚠️' : insightCls === 'warn' ? '🟡' : '✅';

  const hnHTML = (isHousehold && item.houseNumber && item.houseNumber !== '—')
    ? `<div class="card-housenumber">
         <span class="hn-icon">🏠</span>
         <span>${esc(item.houseNumber)}</span>
         ${item.zone && !String(item.name||'').includes(String(item.zone))
            ? `<span class="hn-sep">·</span><span class="hn-zone">${esc(item.zone)}</span>` : ''}
       </div>` : '';

  let bodyHTML;
  if(isHousehold){
    bodyHTML = renderHouseholdTabs(item);
  } else if(hasGallery){
    bodyHTML = renderGalleryTabs(def, item);
  } else {
    const fields = cardFields(def.key, item).filter(f => f[1] != null && f[1] !== '');
    bodyHTML = `
      <div style="padding:12px 16px">
        ${fields.map(f => {
          const opts = f[2] || {};
          const cls = ['kv'];
          if(opts.chip) cls.push('kv-chip');
          if(opts.danger) cls.push('danger');
          if(opts.warn) cls.push('warn');
          if(opts.calm) cls.push('calm');
          let vHTML = esc(f[1]);
          if(opts.contact === 'phone' && f[1] && f[1] !== '-'){
            vHTML = `<a class="kv-tel" href="tel:${String(f[1]).replace(/[^0-9+]/g,'')}">📞 ${esc(f[1])}</a>`;
          } else if(opts.chip){
            vHTML = `<span class="chip">${esc(f[1])}</span>`;
          }
          return `<div class="${cls.join(' ')}"><span class="k">${esc(f[0])}</span><span class="v">${vHTML}</span></div>`;
        }).join('')}
      </div>`;
  }

  host.innerHTML = `
    <div class="card" style="--acc:${def.color}">
      <div class="card-head">
        <div class="card-ico">${def.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="card-title">${esc(item.name || def.label)}</div>
          ${hnHTML}
          <div class="card-badge">${esc(def.label)}${item.type ? ' · ' + esc(item.type) : ''}${item.zone ? ' · ' + esc(item.zone) : ''}</div>
        </div>
        <button class="card-close" data-close>✕</button>
      </div>
      <div class="card-body">
        ${bodyHTML}
        ${isHousehold ? `
          <div class="risk-meter" style="--risk-c:${risk>=70?'#ff2d55':risk>=45?'#ffb020':'#22ff88'}">
            <div class="risk-meter-head"><span>RISK INDEX</span><b>${risk}%</b></div>
            <div class="risk-meter-track"><div class="risk-meter-fill" data-pct="${risk}"></div></div>
          </div>` : ''}
        <div class="insight insight-${insightCls}">
          <span class="insight-ico">${insightIco}</span>
          <span>${esc(buildInsight(def.key, item, risk))}</span>
        </div>
        <div class="card-actions">
          <button class="act go full" data-act="route">🚗 คำนวณเส้นทางอพยพ</button>
          <button class="act sos" data-act="sos">🚨 แจ้งกู้ภัย</button>
          <button class="act" data-act="nav">🗺️ นำทาง</button>
          <button class="act" data-act="copy">📋 คัดลอก</button>
          ${isHousehold ? '<button class="act pdf-act full" data-act="pdf">📄 ส่งออก PDF — การ์ดครัวเรือน</button>' : ''}
          ${def.hasPDF ? '<button class="act pdf-act full" data-act="pdf-medical">📄 ส่งออก PDF — หน่วยแพทย์</button>' : ''}
        </div>
      </div>
    </div>`;
  positionCard(latlng);

  requestAnimationFrame(() => {
    host.firstElementChild.classList.add('in');
    setTimeout(() => {
      const f = host.querySelector('.risk-meter-fill');
      if(f) f.style.width = f.dataset.pct + '%';
    }, 140);
    if(isHousehold) setTimeout(() => initHouseholdMiniMap(item), 200);
    if(hasGallery && !isHousehold) setTimeout(() => initMiniMapGeneric(item), 200);
  });

  /* ── Tabs (shared for Households + Gallery) ── */
  if(isHousehold || hasGallery){
    host.querySelectorAll('.card-tab').forEach(tab => {
      tab.addEventListener('click', ev => {
        ev.stopPropagation();
        const tabKey = tab.dataset.tab;
        host.querySelectorAll('.card-tab').forEach(t => t.classList.toggle('active', t === tab));
        host.querySelectorAll('.card-tab-content').forEach(c =>
          c.classList.toggle('active', c.dataset.content === tabKey));
        if(tabKey === 'map' && isHousehold) setTimeout(() => initHouseholdMiniMap(item), 100);
        if(tabKey === 'overview' && !isHousehold) setTimeout(() => initMiniMapGeneric(item), 100);
      });
    });
  }

  /* ── Gallery interactions ── */
  if(isHousehold || hasGallery){
    const photos = parseJSONField(item.photos, []);
    host.querySelectorAll('.gallery-item').forEach((el, idx) => {
      el.addEventListener('click', ev => {
        if(ev.target.closest('[data-delete]')) return;
        const p = photos.find(x => x.id === el.dataset.photoId);
        openLightbox(el.dataset.url, p ? p.caption : '', photos, idx);
      });
    });
    host.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async ev => {
        ev.stopPropagation();
        if(!confirm('ลบรูปนี้?')) return;
        const layerKey = btn.dataset.layer || def.key;
        try {
          await deleteLayerPhotoFromBackend(layerKey, btn.dataset.hh, btn.dataset.delete);
          const it = (S.payload.data[layerKey] || []).find(h => h.id === btn.dataset.hh);
          if(it){
            it.photos = parseJSONField(it.photos, []).filter(p => p.id !== btn.dataset.delete);
            hideCard();
            setTimeout(() => showCard(def, it, latlng), 250);
          }
          toast('🗑 ลบรูปแล้ว', 'info', 2500);
        } catch(e){ toast('⚠ ลบไม่สำเร็จ: ' + e.message, 'warn'); }
      });
    });
    host.querySelectorAll('[data-upload]').forEach(btn => {
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        uploadLayerPhotos(btn.dataset.layer || def.key, btn.dataset.upload, item);
      });
    });
    host.querySelectorAll('[data-camera]').forEach(btn => {
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        openCameraCapture(btn.dataset.camera || btn.dataset.upload, btn.dataset.layer || def.key, item);
      });
    });
  }

  host.querySelector('[data-close]').addEventListener('click', hideCard);
  host.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      const a = btn.dataset.act;
      if(a === 'route') computeEvacuation(L.latLng(num(item.lat), num(item.lng)), item.name);
      else if(a === 'sos'){ playSound('alarm'); vibrate([40,30,40,30,80]); toast(`🚨 ส่งแจ้งเหตุ "${item.name}" แล้ว`, 'danger', 4000); }
      else if(a === 'nav'){
        const lat = num(item.lat), lng = num(item.lng);
        if(isFinite(lat)) window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
      } else if(a === 'copy'){
        copyText(`${item.name}\nพิกัด: ${num(item.lat).toFixed(6)}, ${num(item.lng).toFixed(6)}`);
        toast('📋 คัดลอกแล้ว');
      } else if(a === 'pdf'){
        exportHouseholdPDF(item);
      } else if(a === 'pdf-medical'){
        exportMedicalUnitPDF(item);
      }
    });
  });
}

function hideCard(){
  const host = $('#cardHost');
  if(!host) return;
  const card = host.firstElementChild;
  if(card){
    card.style.opacity = '0';
    card.style.transform = 'scale(.9) translateY(20px)';
    setTimeout(() => { host.innerHTML = ''; host.style.display = 'none'; }, 250);
  }
}

function positionCard(latlng){
  if(!latlng || !S.map) return;
  const host = $('#cardHost');
  const pt = S.map.latLngToContainerPoint(latlng);
  const card = host.firstElementChild;
  if(!card) return;
  const w = card.offsetWidth || 380, h = card.offsetHeight || 500;
  const vw = window.innerWidth, vh = window.innerHeight;
  if(vw < 640){
    host.style.left = '0'; host.style.top = 'auto';
    host.style.bottom = '0'; host.style.width = '100%';
    host.style.transform = 'translate3d(0,0,0)';
    return;
  }
  host.style.bottom = 'auto';
  host.style.width = '380px';
  let left = pt.x + 26, top = pt.y - h/2;
  if(left + w > vw - 14) left = pt.x - w - 26;
  left = Math.max(14, Math.min(left, vw - w - 14));
  top = Math.max(90, Math.min(top, vh - h - 100));
  host.style.left = '0'; host.style.top = '0';
  host.style.transform = `translate3d(${left}px,${top}px,0)`;
}

/* ═══════════════════════════════════════════════════════════════════════
   LIGHTBOX
   ═══════════════════════════════════════════════════════════════════════ */
function openLightbox(url, caption, photosList, currentIdx){
  const existing = document.getElementById('photoLightbox');
  if(existing) existing.remove();
  const lb = document.createElement('div');
  lb.id = 'photoLightbox';
  lb.className = 'lightbox-backdrop';
  lb.innerHTML = `
    <div class="lightbox-content">
      <button class="lightbox-close" data-close>✕</button>
      <button class="lightbox-nav prev" data-nav="-1" ${currentIdx === 0 ? 'disabled' : ''}>‹</button>
      <button class="lightbox-nav next" data-nav="1" ${currentIdx >= photosList.length - 1 ? 'disabled' : ''}>›</button>
      <img src="${esc(url)}" alt="${esc(caption||'')}" class="lightbox-img">
      <div class="lightbox-caption">
        <div class="lightbox-caption-title">${esc(caption||'')}</div>
        <div class="lightbox-caption-idx">${currentIdx+1} / ${photosList.length}</div>
      </div>
    </div>`;
  document.body.appendChild(lb);
  const navigate = (delta) => {
    const next = currentIdx + delta;
    if(next < 0 || next >= photosList.length) return;
    const p = photosList[next];
    openLightbox(p.url, p.caption, photosList, next);
  };
  lb.addEventListener('click', ev => {
    if(ev.target === lb || ev.target.closest('[data-close]')){ lb.remove(); return; }
    const nav = ev.target.closest('[data-nav]');
    if(nav) navigate(+nav.dataset.nav);
  });
  document.addEventListener('keydown', function escHandler(e){
    if(e.key === 'Escape'){ lb.remove(); document.removeEventListener('keydown', escHandler); }
    if(e.key === 'ArrowLeft') navigate(-1);
    if(e.key === 'ArrowRight') navigate(1);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   CAMERA CAPTURE (Phase 16 + 17 — Generic)
   ═══════════════════════════════════════════════════════════════════════ */
let cameraStream = null;
let cameraCaptured = null;

async function openCameraCapture(itemId, layerName, itemRef){
  layerName = layerName || 'Households';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('⚠ เบราว์เซอร์ไม่รองรับกล้อง', 'warn', 4000); return;
  }
  const isSecure = location.protocol === 'https:' ||
                   location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if(!isSecure){ toast('⚠ ต้องใช้ HTTPS', 'warn', 5000); return; }

  const existing = document.getElementById('cameraModal');
  if(existing) existing.remove();

  const item = itemRef || (S.payload.data[layerName] || []).find(x => x.id === itemId) || {};
  const categories = getCategoriesForItem(layerName, item);
  const layerLabel = {
    Households: 'ครัวเรือน', Landmarks: 'สถานที่สำคัญ',
    LocalShops: 'ร้านค้า', EducationalSites: 'โรงเรียน', MedicalUnits: 'หน่วยแพทย์'
  }[layerName] || layerName;

  const modal = document.createElement('div');
  modal.id = 'cameraModal';
  modal.className = 'camera-modal-backdrop';
  modal.innerHTML = `
    <div class="camera-modal">
      <header class="camera-modal-header">
        <span style="font-size:20px">📸</span>
        <div style="flex:1">
          <div class="camera-modal-title">ถ่ายภาพ</div>
          <div class="camera-modal-sub">${esc(layerLabel)} · ${esc(itemId)}</div>
        </div>
        <button class="camera-modal-close" data-close>✕</button>
      </header>
      <div class="camera-modal-body">
        <div class="camera-viewport">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <canvas id="cameraCanvas" style="display:none"></canvas>
          <div class="camera-preview" id="cameraPreview" style="display:none">
            <img id="cameraPreviewImg" alt="preview">
          </div>
          <div class="camera-guide">
            <div class="guide-corner tl"></div><div class="guide-corner tr"></div>
            <div class="guide-corner bl"></div><div class="guide-corner br"></div>
          </div>
          <div class="camera-status" id="cameraStatus">กำลังเปิดกล้อง…</div>
        </div>
        <div class="camera-controls" id="cameraControls">
          <button class="camera-btn switch" data-camera-act="switch">🔄</button>
          <button class="camera-btn capture" data-camera-act="capture"><span class="camera-btn-inner"></span></button>
          <button class="camera-btn" data-camera-act="close">✕</button>
        </div>
        <div class="camera-controls" id="previewControls" style="display:none">
          <button class="camera-btn-action retake" data-camera-act="retake">↩ ถ่ายใหม่</button>
          <button class="camera-btn-action save" data-camera-act="save">✓ บันทึก</button>
        </div>
        <div class="camera-info" id="cameraInfo" style="display:none">
          <input type="text" id="cameraCaption" placeholder="${esc(getCaptionHint(layerName, item))}" class="camera-caption-input">
          <select id="cameraCategory" class="camera-category-select">
            ${categories.map(c => `<option value="${esc(c.value)}">${esc(c.label)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const video = modal.querySelector('#cameraVideo');
  const canvas = modal.querySelector('#cameraCanvas');
  const preview = modal.querySelector('#cameraPreview');
  const previewImg = modal.querySelector('#cameraPreviewImg');
  const status = modal.querySelector('#cameraStatus');
  const controls = modal.querySelector('#cameraControls');
  const previewControls = modal.querySelector('#previewControls');
  const info = modal.querySelector('#cameraInfo');
  let facingMode = 'environment';

  const stopStream = () => {
    if(cameraStream){ cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  };
  const closeModal = () => { stopStream(); modal.remove(); cameraCaptured = null; };
  const startStream = async () => {
    try {
      stopStream();
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = cameraStream;
      status.style.display = 'block';
      status.textContent = '📸 พร้อมถ่าย';
      setTimeout(() => { status.style.display = 'none'; }, 2000);
    } catch(err){
      status.style.display = 'block';
      status.style.color = '#ffb3c2';
      status.textContent = '⚠ ' + (err.name === 'NotAllowedError' ? 'ไม่ได้รับอนุญาต' : err.message);
    }
  };
  const capturePhoto = () => {
    if(!cameraStream) return;
    const w = video.videoWidth, h = video.videoHeight;
    if(!w || !h) return;
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    cameraCaptured = canvas.toDataURL('image/jpeg', 0.82);
    previewImg.src = cameraCaptured;
    preview.style.display = 'grid';
    video.style.display = 'none';
    controls.style.display = 'none';
    previewControls.style.display = 'flex';
    info.style.display = 'flex';
    status.style.display = 'none';
    modal.classList.add('flash');
    setTimeout(() => modal.classList.remove('flash'), 300);
    playSound('click'); vibrate(20);
  };
  const retake = () => {
    cameraCaptured = null;
    preview.style.display = 'none';
    video.style.display = 'block';
    controls.style.display = 'flex';
    previewControls.style.display = 'none';
    info.style.display = 'none';
  };
  const saveCaptured = async () => {
    if(!cameraCaptured) return;
    const caption = modal.querySelector('#cameraCaption').value.trim() || 'ภาพถ่าย';
    const category = modal.querySelector('#cameraCategory').value;
    const finalDataUrl = await compressImage(cameraCaptured, 1280, 0.78);
    closeModal();
    toast('📸 กำลังบันทึก…', 'info', 3000);
    try {
      await saveSinglePhotoGeneric(layerName, itemId, {
        url: finalDataUrl, caption, category, source: 'camera'
      });
      const list = S.payload.data[layerName] || [];
      const it = list.find(h => h.id === itemId);
      if(it){
        it.photos = parseJSONField(it.photos, []);
        it.photos.push({
          id: 'p_' + Date.now(),
          url: finalDataUrl, caption, category,
          source: 'camera', ts: new Date().toISOString()
        });
        hideCard();
        const def = LAYER_DEFS.find(l => l.key === layerName);
        setTimeout(() => showCard(def, it, L.latLng(num(it.lat), num(it.lng))), 300);
      }
      toast('✅ บันทึกสำเร็จ', 'info', 3000);
    } catch(e){ toast('⚠ ' + e.message, 'warn', 4000); }
  };

  modal.addEventListener('click', ev => {
    if(ev.target === modal){ closeModal(); return; }
    const btn = ev.target.closest('[data-camera-act]');
    if(!btn) return;
    const a = btn.dataset.cameraAct;
    if(a === 'close') closeModal();
    else if(a === 'capture') capturePhoto();
    else if(a === 'retake') retake();
    else if(a === 'save') saveCaptured();
    else if(a === 'switch'){
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      toast(`🔄 สลับกล้อง${facingMode === 'environment' ? 'หลัง' : 'หน้า'}`);
      startStream();
    }
  });
  modal.querySelector('[data-close]').addEventListener('click', closeModal);

  const keyHandler = (e) => {
    if(!document.body.contains(modal)){ document.removeEventListener('keydown', keyHandler); return; }
    if(e.key === 'Escape') closeModal();
    if(e.key === ' ' && cameraStream){ e.preventDefault(); capturePhoto(); }
    if(e.key === 'Enter' && cameraCaptured){ saveCaptured(); }
  };
  document.addEventListener('keydown', keyHandler);

  await startStream();
}

/* ═══════════════════════════════════════════════════════════════════════
   IMAGE COMPRESSION
   ═══════════════════════════════════════════════════════════════════════ */
function compressImage(dataUrl, maxDimension, quality){
  maxDimension = maxDimension || 1280;
  quality = quality || 0.78;
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDimension || height > maxDimension){
        if(width > height){ height = Math.round(height * (maxDimension / width)); width = maxDimension; }
        else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      try { resolve(canvas.toDataURL('image/jpeg', quality)); }
      catch(e){ resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   UPLOAD LAYER PHOTOS (Generic)
   ═══════════════════════════════════════════════════════════════════════ */
async function uploadLayerPhotos(layerName, itemId, itemRef){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.style.display = 'none'; document.body.appendChild(input);

  const item = itemRef || (S.payload.data[layerName] || []).find(x => x.id === itemId) || {};
  const categories = getCategoriesForItem(layerName, item);

  input.addEventListener('change', async () => {
    const files = [...input.files];
    if(!files.length){ input.remove(); return; }
    toast(`🗜️ กำลังบีบอัด ${files.length} รูป…`, 'info', 3000);

    const photos = [];
    let totalOrig = 0, totalComp = 0;

    for(const file of files){
      try {
        totalOrig += file.size;
        const dataUrl = await fileToBase64(file);
        const compressed = await compressImage(dataUrl, 1280, 0.78);
        totalComp += Math.round((compressed.length - 22) * 3 / 4);

        const hint = getCaptionHint(layerName, item);
        const caption = prompt(`${hint}\n\nคำอธิบาย "${file.name}":`,
          file.name.replace(/\.[^.]+$/, '')) || '';
        const defaultCat = categories[0] ? categories[0].value : 'other';
        const category = prompt(
          `หมวดหมู่ (${categories.map(c => c.value).join('/')}):`, defaultCat
        ) || defaultCat;

        photos.push({
          id: 'p_' + Date.now() + '_' + photos.length,
          url: compressed, caption,
          category: category.toLowerCase(),
          source: 'upload', ts: new Date().toISOString()
        });
      } catch(e){ console.warn('Upload error:', e); }
    }

    if(!photos.length){ input.remove(); return; }
    const savedKB = Math.round((totalOrig - totalComp) / 1024);
    const pct = totalOrig > 0 ? Math.round((1 - totalComp / totalOrig) * 100) : 0;
    toast(`🗜️ ประหยัด ${savedKB} KB (${pct}%)`, 'info', 4000);

    try {
      await saveLayerPhotosBatch(layerName, itemId, photos);
      const it = (S.payload.data[layerName] || []).find(h => h.id === itemId);
      if(it){
        it.photos = (parseJSONField(it.photos, [])).concat(photos);
        hideCard();
        const def = LAYER_DEFS.find(l => l.key === layerName);
        setTimeout(() => showCard(def, it, L.latLng(num(it.lat), num(it.lng))), 300);
      }
      toast(`✅ อัปโหลด ${photos.length} รูปสำเร็จ`, 'info', 3000);
    } catch(e){ toast('⚠ ' + e.message, 'warn', 4000); }
    input.remove();
  });
  input.click();
}

async function exportHouseholdPDF(item){
  if(!window.jspdf){ toast('⚠ jsPDF ยังไม่โหลด', 'warn'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const W = 210, H = 297, M = 14, cW = W - M * 2;
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  const dateStr = `${p(now.getDate())}/${p(now.getMonth()+1)}/${now.getFullYear()+543} ${p(now.getHours())}:${p(now.getMinutes())}`;

  pdf.setFillColor(14, 22, 40); pdf.rect(0, 0, W, 30, 'F');
  pdf.setTextColor(0, 240, 255); pdf.setFontSize(20); pdf.setFont(undefined, 'bold');
  pdf.text('🛰️', M, 15);
  pdf.setFontSize(13); pdf.text('PhlapphlaChai 3D GeoAI', M + 12, 13);
  pdf.setFontSize(9); pdf.setTextColor(180, 200, 220); pdf.setFont(undefined, 'normal');
  pdf.text('องค์การบริหารส่วนตำบลพลับพลาไชย', M + 12, 19);
  pdf.text('ต.พลับพลาไชย อ.อู่ทอง จ.สุพรรณบุรี', M + 12, 24);

  pdf.setFontSize(8); pdf.text('(.........................................)', M + 5, y + 25);
  pdf.text('เจ้าหน้าที่ศูนย์บัญชาการ', M + 5, y + 30);
  pdf.text('ลงชื่อผู้อนุมัติ', M + cW / 2 + 10, y + 8);
  pdf.line(M + cW / 2 + 5, y + 20, M + cW / 2 + 5 + sigW - 10, y + 20);

  playSound('success');
}

/* ═══════════════════════════════════════════════════════════════════════

  let y = 38;
  pdf.setTextColor(20, 40, 80); pdf.setFontSize(17); pdf.setFont(undefined, 'bold');
  pdf.text('การ์ดหน่วยแพทย์/กู้ชีพ', M, y); y += 8;
  pdf.setFontSize(12); pdf.setTextColor(60, 90, 140); pdf.setFont(undefined, 'normal');

    pdf.setFillColor(220, 60, 20); pdf.rect(M, y - 4, 3, 6, 'F');
    pdf.setTextColor(200, 50, 20); pdf.setFontSize(11); pdf.setFont(undefined, 'bold');

      if(i % 2 === 0){ pdf.setFillColor(250, 245, 242); pdf.rect(M, y - 4, cW, 6.5, 'F'); }
      pdf.setTextColor(130, 100, 90); pdf.text(String(row[0]), M + 3, y);
      pdf.setTextColor(40, 40, 60); pdf.setFont(undefined, 'bold');
      pdf.text(String(row[1] || '-'), M + 55, y);
      pdf.setFont(undefined, 'normal'); y += 6.5;
    });
    y += 3;
  };

  drawSection('🏥 ข้อมูลหน่วยแพทย์');
  drawRows([
    ['รหัสหน่วย', item.id || '-'],
    ['ประเภท', item.type || '-'],
    ['ความจุผู้ป่วย', (item.capacity || 0) + ' เตียง'],
    ['รถพยาบาล', (item.ambulances || 0) + ' คัน'],
    ['โทรศัพท์', item.phone || '-'],
    ['พิกัด', num(item.lat).toFixed(6) + ', ' + num(item.lng).toFixed(6)],
    ['สถานะ', item.status || '-']
  ]);

  const photos = parseJSONField(item.photos, []);
  if(photos.length){
    drawSection('📊 การยืนยันศักยภาพ');
    const have = new Set(photos.map(p => p.category));
    const verifRows = Object.entries(MEDICAL_VERIFICATION_CATEGORIES).map(([k, c]) => {
      const status = have.has(k) ? '✓ มีหลักฐาน' : (c.required ? '✗ ขาด' : '— ไม่บังคับ');
      return [c.label, status];
    });
    drawRows(verifRows);

    const totalWeight = Object.values(MEDICAL_VERIFICATION_CATEGORIES)
      .reduce((s, c) => s + c.weight, 0);
    const earnedWeight = Object.entries(MEDICAL_VERIFICATION_CATEGORIES)
      .filter(([k]) => have.has(k))
      .reduce((s, [, c]) => s + c.weight, 0);
    const pct = Math.round(earnedWeight / totalWeight * 100);

    pdf.setFillColor(pct >= 80 ? 34 : pct >= 50 ? 255 : 220,
                     pct >= 80 ? 200 : pct >= 50 ? 176 : 60,
                     pct >= 80 ? 100 : pct >= 50 ? 32 : 80);
    pdf.roundedRect(M, y, cW, 10, 2, 2, 'F');
    pdf.setTextColor(255, 255, 255); pdf.setFontSize(11); pdf.setFont(undefined, 'bold');

    pdf.setFontSize(8); pdf.setFont(undefined, 'normal');
    pdf.text(`${photos.length} รูปที่บันทึก`, W - M - 5, y + 6.5, { align:'right' });

  if(photos.length){

          pdf.rect(px, y, imgW, imgH, 'S');

          pdf.setTextColor(180, 140, 120); pdf.setFontSize(7);

        }
        pdf.setFontSize(7); pdf.setTextColor(100, 80, 70);
        const caption = (photos[i].caption || '').slice(0, 22);
        pdf.text(caption, px + imgW/2, y + imgH + 3, { align:'center' });
        pdf.setFontSize(6); pdf.setTextColor(200, 100, 60);
        const catLabel = (MEDICAL_CATEGORIES._default.find(c => c.value === photos[i].category) || {}).label || 'other';
        pdf.text(catLabel.slice(0, 20), px + imgW/2, y + imgH + 6, { align:'center' });
      } catch(e){ console.warn('Image error:', e); }
      col++;
      if(col >= 3){ col = 0; y += imgH + 10; }
    }
    if(col !== 0) y += imgH + 10;
    y += 4;
  }

  if(y > H - 55){ pdf.addPage(); y = 30; }
  y = Math.max(y + 10, H - 55);
  pdf.setDrawColor(180, 200, 220); pdf.setLineWidth(0.2); pdf.line(M, y, W - M, y);
  y += 8;
  pdf.setTextColor(80, 100, 130); pdf.setFontSize(9); pdf.setFont(undefined, 'normal');
  const sigW = (cW - 10) / 2;
  pdf.text('ลงชื่อผู้จัดทำ', M + 10, y + 8);
  pdf.setDrawColor(40, 60, 90); pdf.line(M + 5, y + 20, M + 5 + sigW - 10, y + 20);
  pdf.setFontSize(8); pdf.text('(.........................................)', M + 5, y + 25);
  pdf.text('เจ้าหน้าที่สาธารณสุข', M + 5, y + 30);
  pdf.text('ลงชื่อผู้อนุมัติ', M + cW / 2 + 10, y + 8);
  pdf.line(M + cW / 2 + 5, y + 20, M + cW / 2 + 5 + sigW - 10, y + 20);
  pdf.setFontSize(8); pdf.text('(.........................................)', M + cW / 2 + 5, y + 25);
  pdf.text('ผู้อำนวยการ รพ.สต.', M + cW / 2 + 5, y + 30);

  const total = pdf.internal.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    pdf.setPage(i);
    pdf.setDrawColor(180, 200, 220); pdf.setLineWidth(0.2);
    pdf.line(M, H - 12, W - M, H - 12);
    pdf.setTextColor(120, 150, 180); pdf.setFontSize(7); pdf.setFont(undefined, 'normal');
    pdf.text('PhlapphlaChai 3D GeoAI Dashboard · หน่วยแพทย์', M, H - 8);
    pdf.text(`หน้า ${i} / ${total}`, W - M, H - 8, { align:'right' });
    pdf.text(item.id || '', W/2, H - 8, { align:'center' });
  }
  pdf.save(`medical_${item.id}_${Date.now()}.pdf`);
  toast('📄 ส่งออก PDF แล้ว', 'info', 3000);
  playSound('success');
}
